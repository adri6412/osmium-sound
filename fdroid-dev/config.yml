repo_url: "https://osmiumsound.qd.je/fdroid/dev/repo"
repo_name: "Osmium Sound (Dev)"
repo_description: >
  Development builds of Osmium Sound Companion (tags with a "-svil" suffix),
  published from the same source as https://osmiumsound.qd.je/fdroid/repo but
  ahead of it and NOT tested to the same standard. Add this repo only if you
  want early/unstable builds; leave it out to stay on stable releases only.
  (https://github.com/adri6412/osmium-sound).

archive_older: 3

# Same publisher, same repo signing keystore/alias as the stable repo
# (fdroid/config.yml) — reused on purpose, see that file's comment for why
# this file intentionally has no keystorepass/keypass (CI appends both at
# runtime from the FDROID_REPO_KEYSTORE_PASSWORD secret).
keystore: "keystore.p12"
repo_keyalias: "osmium-sound-fdroid"
