### HiFi Player — automatic installation preseed with interactive disk selection.
### The installer clones the live system (which already contains the 'hifi'
### user and all services), so NO user/password questions are asked.

#### Localization (no questions)
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select it

#### Network (auto, fixed hostname)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string hifiplayer
d-i netcfg/get_domain string local
d-i netcfg/hostname string hifiplayer

#### Clock / timezone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Rome
d-i clock-setup/ntp boolean true

#### Clone the running live system (pulls in user 'hifi', services, app)
d-i live-installer/enable boolean true

#### Users — do NOT create an extra normal account ('hifi' is cloned from the
#### live image). user-setup refuses "no root AND no user", so we enable root
#### with a known password; this stops it from prompting for a user account.
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password password hifi
d-i passwd/root-password-again password hifi
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

#### Partitioning — fully interactive, native Debian Installer screens.
#### GPT layout that boots on BOTH BIOS and UEFI:
####   1 MB   bios_grub  (BIOS boot on GPT)
####   512MB  EFI ESP    (UEFI boot)
####   rest   ext4 /     (root)
####
#### Neither partman-auto/disk NOR partman-auto/init_automatically_partition
#### is preseeded, so the installer's own "Guided - use entire disk / ...with
#### LVM / ...encrypted LVM / Manual" screen and its own disk-picker both
#### show up as normal — pick "Guided - use entire disk" (no LVM), then the
#### disk to install on. Everything AFTER that (the actual partition
#### layout: sizes/filesystems below) is still fully automatic.
####
#### Earlier attempts tried to preseed/skip those two screens (to make the
#### install fully hands-off except for the disk choice). Both attempts
#### caused real problems on a disk that already had a partition table from
#### a previous install: preseeding partman-auto/init_automatically_
#### partition="regular" didn't reliably win over D-I's own "biggest free
#### space between existing partitions" option, and a custom early_command
#### disk-chooser built to route around that caused a black-screen/reboot
#### loop after partitioning. D-I's own interactive flow for these two
#### questions is what actually gets tested by millions of Debian installs,
#### so it stays interactive rather than us fighting it.
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
      hifi :: \
              1 1 1 free \
                      $iflabel{ gpt } \
                      method{ biosgrub } \
              . \
              512 512 512 fat32 \
                      $iflabel{ gpt } \
                      method{ efi } format{ } \
              . \
              1024 1000 -1 ext4 \
                      method{ format } format{ } \
                      use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ / } \
              .

d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Bootloader
#### d-i's own grub-installer component is SKIPPED entirely. This image ships
#### BOTH bootloader families pre-installed (grub-pc + grub-efi-amd64-signed/
#### shim-signed, see package-lists/hifi.list.chroot), and grub-installer's
#### own logic tries to `dpkg --purge` the "other" family as part of switching
#### to the one it wants — that purge fails unconditionally here (shim-signed
#### depends on grub-efi-amd64-bin; grub-efi-amd64-signed is dpkg-protected),
#### aborting the whole install on EITHER firmware. Confirmed via real d-i
#### syslog on both UEFI hardware and a BIOS-mode VM. The actual bootloader
#### install now happens in the late_command (hifi-finalize-install.sh ->
#### hifi-grub-install.sh), which detects the real firmware and reconfigures
#### only the matching, already-installed package family directly.
d-i grub-installer/skip boolean true
d-i lilo-installer/skip boolean true

# The lines below are now moot (grub-installer never runs) and kept only as
# documentation of the previous intent; hifi-grub-install.sh is the source of
# truth for bootdev/removable-media handling.
#d-i grub-installer/only_debian boolean true
#d-i grub-installer/with_other_os boolean false
#d-i grub-installer/bootdev string default
#d-i grub-installer/force-efi-extra-removable boolean true

#### Finalize the INSTALLED system: install the bootloader (critical) and
#### apply the hidden/branded boot config (cosmetic; the bootloader step
#### regenerates GRUB and would otherwise overwrite it).
####
#### Deliberately NOT wrapped in a trailing "; true": a previous version
#### forced this whole command to always report success, which silently hid
#### a real BIOS grub-install failure — d-i reported the installation as
#### finished on a disk with no bootloader at all. hifi-finalize-install.sh
#### itself distinguishes "bootloader install failed" (fatal, exit 1) from
#### "boot branding hiccup" (cosmetic, always exit 0), so letting its real
#### exit status propagate here surfaces only genuine, critical failures as a
#### late_command error in d-i's own log instead of masking everything.
d-i preseed/late_command string \
  in-target sh -c 'test -f /usr/local/sbin/hifi-finalize-install.sh && sh /usr/local/sbin/hifi-finalize-install.sh'

#### Finish — reboot automatically, no final prompt
d-i finish-install/reboot_in_progress note