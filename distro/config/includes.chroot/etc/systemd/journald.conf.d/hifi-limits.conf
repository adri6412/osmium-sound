# HiFi Player — ceilings on the persistent journal.
#
# Keeping the journal on disk is deliberate (0400 hook / apply.d/0028: the
# support bundles need it), but with no limits journald grows to its default
# 10% of the filesystem and keeps large journal files mapped in RAM (~30 MB of
# PSS, measured). These ceilings apply at rotation; migration 0055 applies them
# to the files that already exist as well, with a one-off vacuum.
#
# Same content in distro/os-update/apply.d/0055-journald-limits.sh — keep the
# two in step.
[Journal]
SystemMaxUse=64M
SystemMaxFileSize=16M
RuntimeMaxUse=32M
