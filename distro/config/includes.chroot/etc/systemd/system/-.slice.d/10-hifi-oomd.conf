# Osmium Sound — the swap half of the systemd-oomd policy.
#
# The only swap is zram (/etc/systemd/zram-generator.conf): compressed RAM.
# When it is nearly full there is nowhere left for anonymous memory to go, and
# the kernel starts reclaiming program text instead, which is the livelock that
# froze a box after hours of radio (2026-09-24: music on, touch and web admin
# dead, the kernel OOM killer never fired). systemd-oomd acts on
# SwapUsedLimit= (oomd.conf, 90 % by default): it kills the cgroup using the
# most swap, and the service's Restart= brings it back.
[Slice]
ManagedOOMSwap=kill
