# Osmium Sound — the pressure half of the systemd-oomd policy.
#
# Memory pressure (PSI) is the direct measure of a box that is stalling:
# the share of time tasks wait for memory. Above 50 % for 20 s every service
# is already crawling (the kiosk stops answering touch, the web admin stops
# loading), so systemd-oomd kills the service under system.slice that is
# reclaiming the most, and its Restart= brings it back. Losing one service for
# a few seconds beats pulling the plug.
#
# squeezelite and the Bluetooth players opt out (ManagedOOMPreference=avoid):
# the music is the one thing that must keep going.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=20s
