# Osmium Sound — keep file sharing out of the boot's way.
#
# A unit pulled in by WantedBy=multi-user.target gets an implicit
# Before=multi-user.target, so the target — and graphical.target, which
# Requires it — is not "reached" until that unit has started. Measured on the
# mini PC with systemd-analyze blame: smbd alone was 5.9s of that wait, for a
# service the on-screen interface never waits on.
#
# DefaultDependencies=no drops the implicit Before=multi-user.target /
# shutdown.target and After=basic.target, so the ordering smbd genuinely needs
# is restated by hand below. It still starts at the same point in the boot,
# just without holding the target back.
#
# Trade-off: it loses systemd's automatic clean-shutdown ordering. Acceptable
# for file sharing, which has no unflushed critical state at power-off.
#
# Same recipe as OS migration 0032, which has been in the field on single-root
# devices since then; an image slot never runs a migration, hence this file.
[Unit]
DefaultDependencies=no
After=basic.target network-online.target
