# Osmium Sound — merge add-ons into /usr, and leave /opt alone.
#
# 🚨 systemd-sysext merges /usr AND /opt by default, and a hierarchy that no
# extension provides content for is mounted as an EMPTY tmpfs. On this device
# that hides /opt — /opt/hifi-qt, the on-screen interface, and
# /opt/hifi-webui. It was seen in the field: someone installed an add-on, the
# running interface carried on (its binary was already open) and never came
# back after its next restart, with the service logging "Unable to locate
# executable /opt/hifi-qt/hifi-qt".
#
# hifi-ext.sh writes EXTENSION_HIERARCHIES=/usr into every extension it
# builds, which is the same rule stated by the extension; this covers the
# boot-time merge of anything else that ends up in /var/lib/extensions.
[Service]
Environment=SYSEXT_HIERARCHIES=/usr
