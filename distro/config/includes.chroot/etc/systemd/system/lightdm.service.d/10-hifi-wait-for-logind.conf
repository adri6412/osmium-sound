[Unit]
# LightDM's shipped unit doesn't hard-order itself after systemd-logind/dbus.
# On a fast installed disk that race is normally won by the time lightdm
# starts, but on slower live-boot media (squashfs read + overlay) lightdm can
# come up before logind has registered seat0, causing autologin to be
# silently skipped and the greeter shown instead. Force the ordering so
# autologin is reliable on both boot paths.
After=systemd-logind.service dbus.service systemd-user-sessions.service
Wants=systemd-logind.service
