# Osmium Sound — keep SSH out of the boot's way.
# See smbd.service.d/hifi-no-boot-block.conf for why. Measured: 0.9s.
# network.target, not network-online.target: sshd binds to whatever is there
# and does not need an address to have been handed out yet.
[Unit]
DefaultDependencies=no
After=basic.target network.target
