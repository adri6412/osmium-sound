# Osmium Sound — compressed swap in RAM (zram), created by
# systemd-zram-generator at boot. No disk swap: this is RAM, so it costs the
# eMMC/SSD nothing and there is no hibernation image to keep consistent (the
# swapfile 0012-remove-hibernate.sh dropped is not coming back).
#
# 🚨 Why an appliance with plenty of RAM still needs swap: with NO swap at all
# the kernel has nowhere to put anonymous pages under memory pressure, so the
# only thing it can reclaim is file-backed memory — including the executable
# text of the very programs that are running. The box then spends all its time
# faulting that text back in from disk and answers nothing at all: no Lyrion,
# no web admin, no journal entries (journald is stalled too), no SSH. That is
# exactly the reported failure — "it got to about 15% of the analysis and
# completely froze, nothing of value in the logs" — and it is why a background
# library analysis (the Bliss plugin) can take the whole appliance down while a
# plain OOM kill would only have cost the analysis.
#
# A small compressed swap gives reclaim somewhere to go, so the machine slows
# down instead of livelocking, and the per-service memory ceilings in
# lyrionmusicserver.service get the chance to kill the offender first.
[zram0]
# Half the RAM, capped at 2 GiB: enough headroom to absorb a runaway analysis
# on a 4 GB box without letting zram itself become the memory problem
# (compressed pages still live in RAM).
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
