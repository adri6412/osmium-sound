[Seat:*]
autologin-user=hifi
autologin-user-timeout=0
user-session=hifi-kiosk
# This `user-session` is the FALLBACK, not the final choice: on every boot
# hifi-kiosk-session.service (/usr/local/sbin/hifi-kiosk-session.sh) writes
# 99-hifi-session.conf, which loads after this file and wins, carrying the
# session that suits this machine — Wayland/labwc where there is a real GPU,
# X11 where there is not (a VM: wlroots refuses the software renderer and the
# kiosk would sit on a black screen). The X11 session is named here on purpose:
# if the selector never runs, the machine still comes up on the session that
# works everywhere. To force it by hand: "wayland" or "x11" in
# /etc/hifi-player/kiosk-session.
#
# xserver-command applies only to the X11 session and to the greeter: it turns
# screensaver/DPMS off at the server level. The cursor is NOT disabled here (no
# -nocursor): the UI hides it itself (the `hifi-hide-cursor` class), so the
# "Pointer" switch in the settings works on both protocols.
xserver-command=X -s 0 -dpms
greeter-hide-users=true
