[Seat:*]
autologin-user=hifi
autologin-user-timeout=0
user-session=hifi-kiosk-wayland
# La sessione predefinita è quella Wayland (labwc): vedi
# distro/os-update/files/kiosk-wayland-session per il perché e per il rollback
# (rimettere user-session=hifi-kiosk riporta alla sessione X11, che resta
# installata).
#
# xserver-command vale solo per la sessione X11 di rollback e per il greeter:
# disattiva screensaver/DPMS a livello di server. Il cursore NON si disabilita
# qui (niente -nocursor): a nasconderlo è la UI stessa (classe
# `hifi-hide-cursor`), così il toggle "Puntatore" delle impostazioni funziona
# su entrambi i protocolli.
xserver-command=X -s 0 -dpms
greeter-hide-users=true
