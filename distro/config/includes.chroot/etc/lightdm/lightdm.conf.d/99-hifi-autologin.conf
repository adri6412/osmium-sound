[Seat:*]
autologin-user=hifi
autologin-user-timeout=0
user-session=hifi-kiosk
# Questo `user-session` è il RIPIEGO, non la scelta finale: a ogni avvio
# hifi-kiosk-session.service (/usr/local/sbin/hifi-kiosk-session.sh) scrive
# 99-hifi-session.conf, che si carica dopo questo file e vince, con la sessione
# giusta per questa macchina — Wayland/labwc dove c'è una GPU vera, X11 dove
# non c'è (VM: wlroots rifiuta il renderer in software e il kiosk resterebbe a
# schermo nero). Qui resta scritta la sessione X11 di proposito: se il
# selettore non gira, la macchina si accende comunque sulla sessione che
# funziona ovunque. Per forzare a mano: "wayland" o "x11" in
# /etc/hifi-player/kiosk-session.
#
# xserver-command vale solo per la sessione X11 e per il greeter: disattiva
# screensaver/DPMS a livello di server. Il cursore NON si disabilita qui
# (niente -nocursor): a nasconderlo è la UI stessa (classe `hifi-hide-cursor`),
# così il toggle "Puntatore" delle impostazioni funziona su entrambi i
# protocolli.
xserver-command=X -s 0 -dpms
greeter-hide-users=true
