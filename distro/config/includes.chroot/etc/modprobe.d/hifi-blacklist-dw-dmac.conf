# dw_dmac / dw_dmac_core (Synopsys DesignWare DMA controller, Intel LPSS):
# its .shutdown hook crashes the kernel on every reboot/poweroff on this
# board (dw_shutdown -> do_dw_dma_disable oops during device_shutdown()),
# hanging forever behind the Plymouth splash. Nothing on this appliance uses
# it -- audio (DAC) and touch are both USB, video is HDMI -- so losing DMA
# acceleration for I2C/SPI/UART peripherals here is a no-op. Also applied to
# already-provisioned devices by OS migration 0043-blacklist-dw-dmac.sh; keep
# both in sync if this ever needs to change.
blacklist dw_dmac
blacklist dw_dmac_core
