# Osmium Sound — nouveau (the open NVIDIA driver) is kept from auto-loading
# ONLY on machines that also have an Intel display GPU.
#
# On hybrid "Optimus" laptops (e.g. Asus F550C: Intel HD 4000 + a discrete
# NVIDIA GT 7xxM) the panel is wired to the Intel iGPU; nouveau there drives
# nothing but a dead output and black-screens the display shortly after boot.
# On machines whose ONLY GPU is NVIDIA (no Intel VGA at all) nouveau IS the
# real display driver and MUST load — so we detect an Intel display-class PCI
# device and skip nouveau only in that case. i915 is never touched, so the
# Intel iGPU keeps full KMS/acceleration everywhere.
#
# Why `install` and not a plain `blacklist`: a blacklist is unconditional and
# would also kill nouveau on NVIDIA-only PCs. The install override makes the
# decision per machine. It works in the initramfs too — Debian ships the real
# kmod modprobe there (not busybox), which honours install rules and
# --ignore-install — so the same logic applies whether nouveau is coldplugged
# early or loaded after pivot. `modprobe nouveau` by name still always works.
#
# Logic: for each PCI device, if it is an Intel (0x8086) display controller
# (class 0x0300xx VGA or 0x0380xx other-display), exit without loading nouveau;
# otherwise load it normally.
install nouveau /bin/sh -c 'for d in /sys/bus/pci/devices/*; do read -r v 2>/dev/null < "$d/vendor" || continue; [ "$v" = 0x8086 ] || continue; read -r c 2>/dev/null < "$d/class" || continue; case "$c" in 0x0300*|0x0380*) exit 0;; esac; done; exec /sbin/modprobe --ignore-install nouveau $CMDLINE_OPTS'
