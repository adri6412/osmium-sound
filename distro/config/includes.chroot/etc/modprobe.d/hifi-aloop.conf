# The snd-aloop Loopback carries several independent audio paths on one card,
# one per subdevice (see hifi_squeezelite.py: SUBDEV 0 = built-in player / DSP
# bridge, SUBDEV 1 = Bluetooth / DSP VU tap, SUBDEV 2.. = one per audio zone
# that converts PCM to DSD player-side). The default is 8 substreams per device,
# too few for MAX_ZONES=8 zones on top of the first two paths. 16 leaves room.
options snd-aloop pcm_substreams=16
