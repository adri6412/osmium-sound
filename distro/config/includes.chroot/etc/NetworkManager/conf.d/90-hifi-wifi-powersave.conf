# Osmium Sound — 802.11 power save OFF on every Wi-Fi profile.
#
# Mains-powered appliance: power save only ever made the box deaf to
# unsolicited LAN traffic (ARP who-has, mDNS queries, TCP SYNs to :9000 and
# :8080) after hours of idle, while its own outbound flows kept working — so
# the box "disappeared" from the LAN and came back the moment something on it
# generated sustained traffic. Debian's kernel ships
# CONFIG_CFG80211_DEFAULT_PS=y and NetworkManager's own default (0) leaves the
# driver default alone, so nothing turned it off until this file.
#
# Same content OS migration 0054 installs on devices that predate the image
# scheme; baked in here so a freshly installed unit is never deaf, instead of
# waiting for its first OS update. 2 = disable. Applies to every profile that
# leaves wifi.powersave at its default; takes effect at (re)activation, and
# hifi-nic-powersave-off.sh covers a connection that is already up.
[connection]
wifi.powersave=2
