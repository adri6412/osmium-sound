# HiFi Player — captive-portal DNS for the setup hotspot.
#
# NetworkManager feeds this directory ONLY to the dnsmasq instance it spawns for
# a connection with ipv4.method=shared (the Osmium-Setup hotspot). It is inert
# on every normally-configured unit — there is no shared connection, so no
# dnsmasq reads it — which is why shipping it fleet-wide is safe.
#
# Resolve EVERY name to the appliance so a phone joining the setup hotspot has
# its OS connectivity check answered by webui_server.py (which 302s the probe to
# the portal), triggering the captive-portal auto-popup.
address=/#/10.42.0.1
