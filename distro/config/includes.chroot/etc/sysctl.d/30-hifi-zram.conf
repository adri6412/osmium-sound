# Osmium Sound — tuning for the zram swap device (see
# /etc/systemd/zram-generator.conf).
#
# Swapping to zram is a memcpy plus a compression, orders of magnitude cheaper
# than the disk read a swappiness of 60 is calibrated for. Left at the default
# the kernel prefers to drop program text over touching swap, which is the
# behaviour we are trying to get away from.
vm.swappiness = 150
# Read-ahead is pointless on a RAM-backed device: 2^0 = one page per fault,
# instead of eight pages of which seven are usually thrown away.
vm.page-cluster = 0
