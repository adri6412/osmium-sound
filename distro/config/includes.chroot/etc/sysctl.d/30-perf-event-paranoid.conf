# Debian ships a stricter default (3) than upstream's perf_event_paranoid --
# unlike the standard levels, Debian's 3 requires CAP_SYS_ADMIN and drops the
# CAP_PERFMON bypass entirely, which is what hifi-beta-agent.service and
# hifi-api.service actually run with (see their AmbientCapabilities=) to read
# intel_gpu_top's GPU busy% without full root. Level 2 is upstream's normal
# "no unprivileged perf at all" default and is the highest level that still
# honors CAP_PERFMON, so this restores the behaviour the services were
# already written to assume, without granting them anything broader.
kernel.perf_event_paranoid = 2
