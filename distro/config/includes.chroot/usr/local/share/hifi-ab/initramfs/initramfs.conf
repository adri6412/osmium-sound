# Osmium Sound — configuration of the initrd DEDICATED to the A/B conversion.
# Used by: mkinitramfs -d /usr/local/share/hifi-ab/initramfs -o /boot/initrd.img-abconvert
# The appliance's production initrd is NOT touched.
MODULES=dep
BUSYBOX=auto
KEYMAP=n
COMPRESS=gzip
DEVICE=
NFSROOT=auto
RUNSIZE=10%
FSTYPE=auto
