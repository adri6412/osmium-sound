# Osmium Sound — configurazione dell'initrd DEDICATO alla conversione A/B.
# Usata da: mkinitramfs -d /usr/local/share/hifi-ab/initramfs -o /boot/initrd.img-abconvert
# L'initrd di produzione dell'apparecchio NON viene toccato.
MODULES=dep
BUSYBOX=auto
KEYMAP=n
COMPRESS=gzip
DEVICE=
NFSROOT=auto
RUNSIZE=10%
FSTYPE=auto
