# Osmium Sound — utenti di servizio a UID fisso.
# Sugli slot immagine /etc è un overlay il cui upper può ombreggiare passwd:
# systemd-sysusers ricrea a ogni avvio ciò che manca, così un'immagine futura
# può aggiungere un utente senza migrazioni. UID fissi anche perché i dati su
# /data (libreria Lyrion, condivisioni) devono avere lo stesso proprietario su
# ogni apparecchio e dopo ogni aggiornamento.
u squeezeboxserver 900:nogroup "Lyrion Music Server" /usr/share/squeezeboxserver /usr/sbin/nologin
m squeezeboxserver audio
m squeezeboxserver cdrom
# Utente delle condivisioni interne (sources_server.py lo crea se manca, con
# UID dinamico: qui è fisso per le installazioni nuove; gli apparecchi
# convertiti conservano il loro, portato da hifi-ab-seed.sh).
u hifimusic 901 "Osmium internal shares" / /usr/sbin/nologin
