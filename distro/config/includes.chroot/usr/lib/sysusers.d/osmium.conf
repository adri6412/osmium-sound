# Osmium Sound — service users at fixed UIDs.
# On an image slot /etc is an overlay whose upper layer can shadow passwd:
# systemd-sysusers recreates whatever is missing at every boot, so a future
# image can add a user with no migration. The UIDs are fixed for a second
# reason too: the data on /data (the Lyrion library, the shares) has to have
# the same owner on every device and after every update.
u squeezeboxserver 900:nogroup "Lyrion Music Server" /usr/share/squeezeboxserver /usr/sbin/nologin
m squeezeboxserver audio
m squeezeboxserver cdrom
# The internal shares' user (sources_server.py creates it when missing, with a
# dynamic UID: here it is fixed for fresh installs, while converted devices
# keep their own, carried over by hifi-ab-seed.sh).
u hifimusic 901 "Osmium internal shares" / /usr/sbin/nologin
# Shared group for the folders BOTH the network shares and Lyrion write into.
# A playlist folder that is also an SMB share is exactly that case, and without
# a group in common the two accounts fought over it: whichever was configured
# last owned the folder and the other one lost write access, so either "save as
# playlist" stopped working or the playlists could be copied in over the
# network but never deleted again except with `sudo rm` over SSH.
# Fixed GID for the same reason the UIDs are fixed: the files live on /data and
# must mean the same thing after every update. sources_server.py creates the
# same group and memberships at runtime for devices that predate this.
g hifishare 902
m hifimusic hifishare
m squeezeboxserver hifishare
