# HiFi Player — live-build CHROOT debconf preseed (lb_chroot_preseed).
#
# NOT to be confused with distro/config/includes.installer/preseed.cfg, which
# answers the Debian Installer's questions for the TARGET system install. This
# file is applied via debconf-set-selections INSIDE THE BUILD CHROOT, before
# live-build installs config/package-lists/*.list.chroot — the standard
# live-build hook point for exactly this problem: a package's postinst asking a
# debconf question (or trying to act on one) during the chroot build, where
# there is no real target disk yet.
#
# grub-pc's postinst offers to grub-install onto a chosen device. Inside the
# build chroot there is no real disk to install onto — answering "no devices"
# lets dpkg configure the package cleanly and skip any install attempt. The
# REAL grub-install onto the target machine's actual disk happens later, at
# install time, driven by the Debian Installer's own grub-installer component
# (see includes.installer/preseed.cfg) — this file only concerns the build.
grub-pc grub-pc/install_devices multiselect
grub-pc grub-pc/install_devices_empty boolean true
grub-pc grub-pc/install_devices_failed boolean true
grub-pc grub-pc/install_devices_failed_upgrade boolean true
