# HiFi Player — private beta telemetry server.
#
# Deploy behind your own reverse proxy (Apache) that terminates TLS -- this
# container only ever speaks plain HTTP, bound to 127.0.0.1 so it is never
# reachable directly from outside the host.
#
# Setup:
#   1. cp .env.example .env
#   2. Fill in BETA_BOOTSTRAP_SECRET (must match the constant baked into
#      distro/config/includes.chroot/usr/local/sbin/hifi-beta-agent.py) and
#      BETA_ADMIN_PASSWORD_HASH (generate with:
#      python3 -c "from werkzeug.security import generate_password_hash as g; print(g('yourpassword'))")
#   3. docker compose up -d
#   4. Point an Apache VirtualHost's ProxyPass at http://127.0.0.1:8090/
services:
  beta-server:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
