repo_url: "https://osmiumsound.qd.je/fdroid/repo"
repo_name: "Osmium Sound"
repo_description: >
  Official self-hosted F-Droid repository for Osmium Sound Companion, the
  Android remote control app for the Osmium Sound hi-fi appliance
  (https://github.com/adri6412/osmium-sound).

archive_older: 3

# Repo signing keystore is generated once locally (PKCS12, alias
# osmium-sound-fdroid) and is NEVER committed here. In CI it is written to
# this path from the FDROID_REPO_KEYSTORE secret (base64-encoded) before
# `fdroid update` runs.
#
# fdroidserver requires config['keystorepass']/['keypass'] to be actual
# dict keys with real values (it uses them to populate the
# FDROID_KEY_STORE_PASS/FDROID_KEY_PASS env vars it passes to keytool
# itself — it does NOT read those env vars as input, and YAML has no
# $VAR interpolation to fake it). So this file intentionally has no
# keystorepass/keypass — CI appends both lines to a throwaway copy of
# this file at runtime, from the FDROID_REPO_KEYSTORE_PASSWORD secret,
# right before running `fdroid update`. Never commit real values here.
keystore: "keystore.p12"
repo_keyalias: "osmium-sound-fdroid"
