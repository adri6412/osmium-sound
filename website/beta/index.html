<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osmium Sound — Beta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e8e8e8;
      --accent: #f5b820;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 700;
    }
    h1 span {
      color: var(--accent);
    }
    p {
      margin-top: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div>
    <h1>Hello, <span>beta</span> world.</h1>
    <p>Osmium Sound beta area — under construction.</p>
  </div>
</body>
</html>
