<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmium Sound - Tutorial di installazione / Installation tutorial</title>
<style>
  :root{
    --bg: #141519;
    --bg2: #1d1f25;
    --panel: #23262d;
    --panel2: #2a2d35;
    --white: #f3f2ee;
    --amber: #e0983f;
    --amber2: #f4b35e;
    --amber-dim: #7a4f22;
    --muted: #93969d;
    --green: #4caf50;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: var(--white);
    min-height:100%;
  }
  #app{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; }
  /* When shown inside the website popup the box hugs its content instead of
     filling the viewport, so the modal can be sized to the card itself. */
  body.embedded{ background:transparent; min-height:0; }
  body.embedded #app{ min-height:0; align-items:flex-start; padding:18px 16px; }
  #card{
    position:relative; width:100%; max-width:680px;
    background: linear-gradient(165deg, var(--bg2), var(--bg) 75%);
    border-radius:20px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.05);
    padding:28px 30px 24px;
    overflow:hidden;
  }
  #eq-bg{ position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; gap:6px; opacity:.05; pointer-events:none; z-index:0; }
  #eq-bg span{ width:10px; background: var(--amber2); border-radius:3px 3px 0 0; animation: eqbar 1.4s ease-in-out infinite; }
  @keyframes eqbar{ 0%,100%{ height:14px; } 50%{ height:110px; } }

  .inner{ position:relative; z-index:1; }

  #header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:10px; }
  .logo{ font-weight:800; letter-spacing:.07em; font-size:15px; white-space:nowrap; }
  .logo .accent{ color: var(--amber); }
  #progress-wrap{ flex:1; height:6px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background: linear-gradient(90deg, var(--amber-dim), var(--amber2)); border-radius:4px; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  #step-count{ font-size:11.5px; color: var(--muted); white-space:nowrap; min-width:52px; text-align:right; }

  #lang-switch{ display:flex; gap:3px; background:var(--panel); border-radius:8px; padding:3px; flex:0 0 auto; }
  #lang-switch button{
    background:none; border:none; color:var(--muted); font-size:11px; font-weight:700;
    padding:4px 8px; border-radius:6px; cursor:pointer; letter-spacing:.03em;
  }
  #lang-switch button.active{ background: var(--amber); color:#1b1d21; }

  .osmio-row{ display:flex; gap:14px; align-items:flex-start; margin-bottom:18px; }
  .osmio-mini{ width:50px; flex:0 0 auto; }
  .osmio-head{ width:44px; height:44px; border-radius:50%; background:var(--white); position:relative; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .osmio-head::after{ content:""; position:absolute; left:-4px; top:-14px; width:52px; height:20px; border:5px solid var(--amber); border-bottom:none; border-radius:100% 100% 0 0; }
  .osmio-cup{ position:absolute; top:15px; width:8px; height:14px; border-radius:4px; background:var(--amber); }
  .osmio-cup.l{ left:-8px; } .osmio-cup.r{ right:-8px; }
  .osmio-eyes{ position:absolute; top:18px; left:9px; width:26px; display:flex; justify-content:space-between; }
  .osmio-eyes span{ width:4.5px; height:4.5px; border-radius:50%; background:#2b2d33; display:block; animation: blink 4.6s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.1); } }
  .osmio-mouth{ position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:12px; height:3.5px; border-radius:3px; background:#c77b2e; animation: talk .4s steps(1) infinite; }
  @keyframes talk{ 0%{ height:3.5px; width:13px; border-radius:3px; } 40%{ height:7px; width:10px; border-radius:50%; } 100%{ height:3.5px; width:13px; border-radius:3px; } }
  .speech{ flex:1; background: rgba(255,255,255,.04); border-left:3px solid var(--amber); border-radius:10px; padding:11px 14px; font-size:14px; line-height:1.45; min-height:20px; }

  .step-eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber2); font-weight:700; margin-bottom:6px; }
  .step-title, #step-title{ font-size:20px; font-weight:700; margin:0 0 12px; }

  .view{ display:none; }
  .view.active{ display:block; animation: fadein .35s ease; }
  @keyframes fadein{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }

  .lead{ font-size:14.5px; color:var(--white); line-height:1.6; margin:0 0 14px; }
  .lead.muted{ color:var(--muted); }

  ul.steps-list, ol.steps-list{ margin:0 0 14px; padding-left:20px; }
  ul.steps-list li, ol.steps-list li{ font-size:14px; line-height:1.55; margin-bottom:8px; }
  ul.steps-list li b, ol.steps-list li b{ color:var(--white); }

  .req-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  @media (max-width:480px){ .req-grid{ grid-template-columns:1fr; } }
  .req-card{ background:var(--panel); border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; border:1px solid rgba(255,255,255,.07); }
  .req-card .ico{ font-size:18px; }
  .req-card b{ font-size:13.5px; display:block; margin-bottom:2px; }
  .req-card span{ font-size:12px; color:var(--muted); line-height:1.4; }

  .info-box{
    background: rgba(224,152,63,.08); border:1px solid rgba(224,152,63,.25);
    border-radius:10px; padding:11px 14px; font-size:13px; line-height:1.55;
    margin-bottom:14px; color: var(--white);
  }
  .info-box b{ color: var(--amber2); }
  .info-box code, .mono{
    background: rgba(0,0,0,.35); border-radius:4px; padding:1px 6px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size:12.5px; color: var(--amber2);
  }

  .warn-box{
    background: rgba(217,99,74,.08); border:1px solid rgba(217,99,74,.3);
    border-radius:10px; padding:11px 14px; font-size:13px; line-height:1.55;
    margin-bottom:14px;
  }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    background: var(--panel); border:1.5px solid rgba(255,255,255,.1); color:var(--muted);
    border-radius:20px; padding:7px 14px; font-size:12.5px; cursor:pointer; font-weight:600;
    transition: all .15s ease;
  }
  .chip:hover{ background: var(--panel2); }
  .chip.active{ border-color: var(--amber); color: var(--white); background: rgba(224,152,63,.12); }
  .chip-tip{
    background: rgba(255,255,255,.04); border-radius:10px; padding:11px 14px;
    font-size:13px; line-height:1.55; margin-bottom:14px; border-left:3px solid var(--amber);
  }

  .dl-btn{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--panel2); border:1px solid rgba(224,152,63,.35);
    color: var(--white); text-decoration:none; font-weight:600; font-size:13px;
    padding:9px 14px; border-radius:9px; margin:2px 6px 8px 0;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .dl-btn:hover{ background:#323640; border-color: var(--amber); }
  .dl-btn:active{ transform: scale(.97); }
  .dl-btn .ico{ font-size:15px; }
  .dl-btn small{ display:block; font-weight:400; color:var(--muted); font-size:10.5px; }

  .mode-block{ display:none; }
  .mode-block.show{ display:block; }

  .version-note{ font-size:11.5px; color:var(--muted); margin:-4px 0 14px; line-height:1.5; }

  #nav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; }
  .btn{
    background: var(--panel); border:1px solid rgba(255,255,255,.1); color: var(--white);
    border-radius:10px; padding:11px 18px; font-size:14px; cursor:pointer; font-weight:600;
    transition: background .2s ease, transform .15s ease, opacity .2s ease;
  }
  .btn:hover{ background:#2b2e35; }
  .btn:active{ transform: scale(.97); }
  .btn.primary{ background: linear-gradient(135deg, var(--amber-dim), var(--amber)); color:#1b1d21; border:none; }
  .btn.primary:hover{ filter: brightness(1.08); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,.12); color:var(--muted); }

  #dots{ display:flex; gap:5px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .step-dot{ width:6px; height:6px; border-radius:50%; background: rgba(255,255,255,.15); transition: background .25s ease, transform .25s ease; cursor:pointer; }
  .step-dot.done{ background: var(--amber-dim); }
  .step-dot.active{ background: var(--amber); transform: scale(1.4); }

  .url-pill{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color: var(--muted); border:1px solid rgba(255,255,255,.14); padding:6px 12px; border-radius:20px; }
  .url-pill a{ color: var(--amber2); text-decoration:none; font-weight:600; }

  .done-badge{ font-size:46px; text-align:center; margin:6px 0 10px; }

  @media (max-width:480px){ #card{ padding:20px 18px 18px; } .logo{ font-size:13px; } }
</style>
</head>
<body>
<div id="app">
  <div id="card">
    <div id="eq-bg"></div>
    <div class="inner" id="inner"></div>
  </div>
</div>

<script>
(function(){

  // ============== embed / auto-height ==============
  // When this page is loaded inside the website's quick-start popup it reports
  // its real content height to the parent, so the modal matches the card size.
  var EMBEDDED = false;
  try { EMBEDDED = window.self !== window.top; } catch(e){ EMBEDDED = true; }
  function reportHeight(){
    if(!EMBEDDED) return;
    var h = Math.ceil(document.documentElement.scrollHeight);
    try { parent.postMessage({ osmiumQuickstartHeight: h }, '*'); } catch(e){}
  }
  if(EMBEDDED){
    window.addEventListener('resize', reportHeight);
    if(window.ResizeObserver){
      var ro = new ResizeObserver(function(){ reportHeight(); });
      // body exists (script sits at the end of body); watch its content box.
      if(document.body) ro.observe(document.body);
    }
  }

  // ============== TEMPLATES (IT / EN) ==============
  var TEMPLATES = {};

  TEMPLATES.it = `
      <div id="header">
        <div class="logo">OSMIUM <span class="accent">SOUND</span></div>
        <div id="progress-wrap"><div id="progress-fill"></div></div>
        <div id="step-count">1/10</div>
        <div id="lang-switch"><button data-lang="it" class="active">IT</button><button data-lang="en">EN</button></div>
      </div>

      <div class="osmio-row">
        <div class="osmio-mini">
          <div class="osmio-head">
            <div class="osmio-cup l"></div><div class="osmio-cup r"></div>
            <div class="osmio-eyes"><span></span><span></span></div>
            <div class="osmio-mouth"></div>
          </div>
        </div>
        <div class="speech" id="osmio-speech"></div>
      </div>

      <div class="view active" data-view="0">
        <div class="step-eyebrow">Prima di iniziare</div>
        <h2 class="step-title">Cosa ti serve</h2>
        <p class="lead">Questo tutorial ti guida passo passo nell'installazione di Osmium Sound, dal download dell'immagine alla prima configurazione. Ecco cosa ti serve prima di partire:</p>
        <div class="req-grid">
          <div class="req-card"><div class="ico">🖥️</div><div><b>Mini PC x86 · 64 bit</b><span>Va bene sia con UEFI sia con BIOS tradizionale</span></div></div>
          <div class="req-card"><div class="ico">💾</div><div><b>Chiavetta USB · min. 8 GB</b><span>Verrà cancellata durante la scrittura dell'immagine</span></div></div>
          <div class="req-card"><div class="ico">🖐️</div><div><b>Uno schermo (facoltativo)</b><span>Monitor touchscreen, TV, oppure nessuno in modalità headless</span></div></div>
          <div class="req-card"><div class="ico">📱</div><div><b>Un browser</b><span>Tablet, telefono o computer per la configurazione iniziale</span></div></div>
        </div>
        <p class="lead muted">Ci vogliono circa 15-20 minuti. Iniziamo.</p>
      </div>

      <div class="view" data-view="1">
        <div class="step-eyebrow">Passo 1</div>
        <h2 class="step-title">Scarica l'immagine</h2>
        <p class="lead">Prima di tutto, come vuoi usare Osmium Sound?</p>
        <div class="chip-row" id="install-mode-chips">
          <div class="chip active" data-mode="disk">💿 Installarlo sul disco interno</div>
          <div class="chip" data-mode="usb">🔌 Avviarlo direttamente dalla chiavetta</div>
        </div>

        <div class="mode-block show" id="mode-disk-block">
          <p class="lead">Scarichi un <b>ISO</b>, lo scrivi su una chiavetta USB (passo successivo) e la usi solo per avviare il programma di installazione, che copia il sistema sul disco interno del mini PC.</p>
          <div class="chip-row" id="disk-version-chips">
            <div class="chip active" data-ver="stable">Versione stabile · v2.5.25</div>
            <div class="chip" data-ver="dev">Versione di sviluppo · v2.5.26-dev.1</div>
          </div>
          <div id="disk-version-links"></div>
          <div class="version-note" id="disk-version-note"></div>
        </div>

        <div class="mode-block" id="mode-usb-block">
          <p class="lead">Scarichi un'immagine <b>già pronta all'uso (<span class="mono">.img.xz</span>)</b>, la scrivi sulla chiavetta e il mini PC si avvia <b>direttamente da lì</b>: niente installazione, niente disco interno toccato. Lascia la chiavetta sempre inserita: è lì che vive il sistema.</p>
          <a class="dl-btn" href="https://github.com/adri6412/osmium-sound/releases/download/v2.5.26-dev.1/hifi-player-v2.5.26-dev.1.img.xz" target="_blank" rel="noopener">
            <span class="ico">⬇️</span><span>hifi-player-v2.5.26-dev.1.img.xz<small>Immagine per avvio diretto da USB</small></span>
          </a>
          <div class="version-note">⚠️ Questa modalità è disponibile per ora solo nella versione di sviluppo (dev) v2.5.26-dev.1: può contenere novità non ancora rifinite.</div>
        </div>

        <div class="info-box">Non trovi la tua versione o vuoi controllare se ne è uscita una più recente? Dai un'occhiata alla sezione download di <b>osmiumsound.it</b> o alla pagina delle <b>release su GitHub</b> del progetto.</div>
      </div>

      <div class="view" data-view="2">
        <div class="step-eyebrow">Passo 2</div>
        <h2 class="step-title">Scrivi l'immagine sulla chiavetta</h2>
        <p class="lead">Da che sistema stai scrivendo l'immagine? Ti mostro lo strumento più comodo.</p>
        <div class="chip-row" id="os-chips">
          <div class="chip active" data-os="windows">Windows</div>
          <div class="chip" data-os="mac">macOS</div>
          <div class="chip" data-os="linux">Linux</div>
        </div>
        <div class="chip-tip" id="os-tip"></div>
        <div id="os-dl"></div>
        <ul class="steps-list">
          <li><b>Osmium Flasher</b> (consigliato dove disponibile): scarica l'immagine, ne verifica la firma e scrive la chiavetta da solo. Non mostra mai il disco di sistema, per evitare di cancellarlo per errore.</li>
          <li>In alternativa vanno bene anche <b>balenaEtcher</b>, <b>Rufus</b> o il comando <span class="mono">dd</span> — tutti scrivono sia file <span class="mono">.iso</span> sia <span class="mono">.img.xz</span> sulla chiavetta.</li>
        </ul>
        <div class="warn-box">⚠️ La chiavetta verrà formattata: tutto il suo contenuto andrà perso. Usane una senza dati importanti.</div>
      </div>

      <div class="view" data-view="3">
        <div class="step-eyebrow">Passo 3</div>
        <h2 class="step-title">Avvia il mini PC dalla chiavetta</h2>
        <ol class="steps-list">
          <li>Inserisci la chiavetta nel mini PC e accendilo.</li>
          <li>Premi il tasto per il <b>menu di avvio</b> (boot menu) — di solito <span class="mono">F11</span>, <span class="mono">F12</span> oppure <span class="mono">Esc</span> — e scegli la chiavetta USB.</li>
          <li>Se la chiavetta compare due volte nel menu, scegli quella che inizia con <span class="mono">UEFI:</span></li>
        </ol>
        <div class="mode-block show" data-modeblock="disk">
          <ol class="steps-list" start="4">
            <li>Seleziona <b>«Install Osmium Sound»</b>. Se vuoi solo provarlo senza installarlo, scegli <b>«Try Osmium Sound (no install)»</b>.</li>
          </ol>
        </div>
        <div class="mode-block" data-modeblock="usb">
          <ol class="steps-list" start="4">
            <li>Non vedrai un vero e proprio installer: con l'immagine <span class="mono">.img.xz</span> il mini PC si avvia già nel sistema pronto all'uso, direttamente dalla chiavetta.</li>
          </ol>
        </div>
        <div class="info-box"><b>Secure Boot:</b> può restare attivo, di solito non dà problemi. Se il mini PC proprio non si avvia dalla chiavetta, entra nel firmware (di solito <span class="mono">F2</span>, <span class="mono">Canc</span> o <span class="mono">Esc</span> all'accensione), disattiva Secure Boot e riprova.</div>
      </div>

      <div class="view" data-view="4">
        <div class="step-eyebrow">Passo 4</div>
        <h2 class="step-title" data-modetitle>Installazione guidata</h2>

        <div class="mode-block show" data-modeblock="disk">
          <ol class="steps-list">
            <li>Nella schermata di benvenuto tocca <b>«Choose disk»</b> e scegli il disco su cui installare.</li>
            <li>Conferma l'avviso: <b>tutti i dati su quel disco verranno cancellati.</b></li>
            <li>Tocca <b>«Erase and install»</b> e attendi: non serve una connessione a internet.</li>
            <li>Il dispositivo si riavvia da solo a fine installazione. <b>Rimuovi la chiavetta</b> dopo il riavvio.</li>
          </ol>
          <div class="info-box">📱 <b>Installare da telefono:</b> in alto a destra compare un QR code. Se non hai un cavo di rete collegato, il mini PC crea una rete Wi-Fi chiamata <span class="mono">Osmium-Setup-XXXX</span> (senza password): connettiti e si aprirà la pagina di installazione. Se non si apre da sola, vai su <span class="mono">http://10.42.0.1</span>.</div>
        </div>

        <div class="mode-block" data-modeblock="usb">
          <p class="lead">Con l'avvio diretto da chiavetta non c'è nulla da installare: il disco interno del mini PC non viene toccato.</p>
          <ul class="steps-list">
            <li>Il sistema parte già pronto direttamente dalla chiavetta.</li>
            <li><b>Lascia la chiavetta sempre inserita:</b> è lì che vive il sistema, non nel disco interno.</li>
            <li>Procedi pure al passo successivo per il primo avvio e la configurazione di rete.</li>
          </ul>
          <div class="info-box">💡 Comodo per provare Osmium Sound senza modificare il mini PC, o per portarlo con te da una macchina all'altra.</div>
        </div>
      </div>

      <div class="view" data-view="5">
        <div class="step-eyebrow">Passo 5</div>
        <h2 class="step-title">Primo avvio e indirizzo di rete</h2>
        <p class="lead">Al primo avvio dopo l'installazione, lo schermo ti chiede come collegarti alla rete:</p>
        <ul class="steps-list">
          <li>Scegli una rete <b>Wi-Fi</b> e inserisci la password,</li>
          <li>oppure collega un <b>cavo di rete</b> e procedi senza configurare nulla.</li>
        </ul>
        <p class="lead">Subito dopo, lo schermo mostra l'indirizzo del dispositivo, ad esempio:</p>
        <div class="info-box"><span class="mono">http://192.168.1.23</span></div>
        <p class="lead muted">È l'indirizzo che userai al passo successivo per completare la configurazione dal browser. In alternativa puoi provare <span class="mono">http://hifiplayer.local</span>, ma l'indirizzo IP mostrato a schermo è più affidabile.</p>
      </div>

      <div class="view" data-view="6">
        <div class="step-eyebrow">Passo 6</div>
        <h2 class="step-title">Configurazione guidata dal browser</h2>
        <p class="lead">Apri l'indirizzo mostrato a schermo (con <span class="mono">http://</span>) da un browser — va bene tablet, telefono o computer, ma un computer è più comodo. La procedura chiede, in ordine:</p>
        <ol class="steps-list">
          <li>Lingua (inglese o italiano)</li>
          <li>Ripristino da un backup, oppure configurazione nuova</li>
          <li>Eventuale aggiornamento, se disponibile</li>
          <li>Nome del dispositivo (facoltativo)</li>
          <li><b>Modalità del dispositivo</b> — vedi sotto</li>
          <li>Puntatore del mouse (solo in modalità con schermo)</li>
          <li>Uscita audio</li>
          <li>Server musicale: su questo dispositivo (Lyrion) o un server Lyrion già esistente</li>
          <li>Aspetto del web player: Osmium o Material</li>
          <li>Servizi musicali: Spotify, TIDAL, Qobuz, Deezer, radio internet — non si installa nulla finché non premi <b>«Install and continue»</b></li>
          <li>Creazione del tuo account (username e password)</li>
          <li>Fuso orario</li>
          <li>Sorgenti musicali: NAS in rete, disco interno (da formattare in ext4 o exFAT) o chiavette USB, che si montano da sole</li>
          <li>Telecomando (facoltativo)</li>
          <li><b>«Complete setup»</b> per finire</li>
        </ol>
        <p class="lead" style="margin-top:4px;">La modalità del dispositivo (passo 5) cambia cosa vedi dopo:</p>
        <div class="chip-row" id="mode-chips">
          <div class="chip active" data-mode="screen">Con schermo</div>
          <div class="chip" data-mode="headless">Headless</div>
          <div class="chip" data-mode="server">Solo server</div>

  function getLangFromUrl(){
    var m = location.search.match(/[?&]lang=(it|en)/);
    if(m) return m[1];
    if(/[?&]en(&|=|$)/.test(location.search)) return 'en';
    return 'it';
  }

  var currentLang = getLangFromUrl();

  function setLangInUrl(lang){
    var url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url.toString());
  }

  function boot(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    if(EMBEDDED) document.body.classList.add('embedded');
    document.getElementById('inner').innerHTML = TEMPLATES[lang];
    wireUp(lang);
    setTimeout(reportHeight, 60);
  }

      }
    }

    var totalSteps = 10;
    var current = 0;

    var views = {};
    document.querySelectorAll('.view').forEach(function(v){ views[v.getAttribute('data-view')] = v; });

    var dotsWrap = document.getElementById('dots');
    dotsWrap.innerHTML = '';
    for(var d=0; d<totalSteps; d++){
      var dot = document.createElement('div');
      dot.className = 'step-dot';
      (function(idx){ dot.addEventListener('click', function(){ showView(idx); }); })(d);
      dotsWrap.appendChild(dot);
    }
    var dotEls = Array.prototype.slice.call(dotsWrap.children);

    var progressFill = document.getElementById('progress-fill');
    var stepCount = document.getElementById('step-count');
    var osmioSpeech = document.getElementById('osmio-speech');
    var backBtn = document.getElementById('backBtn');
    var nextBtn = document.getElementById('nextBtn');

    function updateNav(){
      stepCount.textContent = (current+1) + '/' + totalSteps;
      progressFill.style.width = (current/(totalSteps-1)*100) + '%';
      dotEls.forEach(function(el,i){
        el.classList.toggle('active', i===current);
        el.classList.toggle('done', i<current);
      });
      osmioSpeech.textContent = S.speeches[current] || '';
      backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';
      nextBtn.textContent = current === totalSteps-1 ? S.restartLabel : S.nextLabel;
      reportHeight();
    }

    function showView(idx){
      Object.keys(views).forEach(function(k){ views[k].classList.remove('active'); });
      views[idx].classList.add('active');
      current = idx;
      updateNav();
      document.getElementById('card').scrollIntoView({behavior:'smooth', block:'start'});
    }

    nextBtn.addEventListener('click', function(){
      if(current === totalSteps-1){ showView(0); }
      else { showView(current+1); }
    });
    backBtn.addEventListener('click', function(){
      if(current > 0){ showView(current-1); }
    });

    // language switch buttons
    document.querySelectorAll('#lang-switch button').forEach(function(b){
      b.addEventListener('click', function(){
        var newLang = b.getAttribute('data-lang');
        if(newLang === currentLang) return;
        setLangInUrl(newLang);
        boot(newLang);
      });
    });

    // OS chips (step 2)
    var osChips = document.querySelectorAll('#os-chips .chip');
    var osTip = document.getElementById('os-tip');
    var osDl = document.getElementById('os-dl');
    function setOs(os){
      osChips.forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-os')===os); });
      osTip.textContent = S.osTips[os];
      osDl.innerHTML = '';
      (S.osDownloads[os]||[]).forEach(function(d){
        var a = document.createElement('a');
        a.className = 'dl-btn'; a.href = d.url; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = '<span class="ico">⬇️</span><span>'+d.name+'<small>'+d.sub+'</small></span>';
        osDl.appendChild(a);
      });
    }
    osChips.forEach(function(c){ c.addEventListener('click', function(){ setOs(c.getAttribute('data-os')); }); });
    setOs('windows');

    // Install mode chips (step 1): disk vs direct-usb
    var installMode = 'disk';
    var modeChipsInstall = document.querySelectorAll('#install-mode-chips .chip');
    var diskBlock = document.getElementById('mode-disk-block');
    var usbBlock = document.getElementById('mode-usb-block');
    var modeBlocksAll = document.querySelectorAll('.mode-block[data-modeblock]');
    var step4Title = document.querySelector('[data-view="4"] [data-modetitle]');

    function applyInstallMode(){
      diskBlock.classList.toggle('show', installMode==='disk');
      usbBlock.classList.toggle('show', installMode==='usb');
      modeBlocksAll.forEach(function(b){
        b.classList.toggle('show', b.getAttribute('data-modeblock')===installMode);
      });
      if(step4Title){ step4Title.textContent = S.installTitles[installMode]; }
    }
    modeChipsInstall.forEach(function(c){
      c.addEventListener('click', function(){
        installMode = c.getAttribute('data-mode');
        modeChipsInstall.forEach(function(x){ x.classList.toggle('active', x===c); });
        applyInstallMode();
      });
    });

    // Disk version chips (stable vs dev) inside step 1
    var verChips = document.querySelectorAll('#disk-version-chips .chip');
    var verLinks = document.getElementById('disk-version-links');
    var verNote = document.getElementById('disk-version-note');
    function setDiskVersion(ver){
      verChips.forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-ver')===ver); });
      var v = S.diskVersions[ver];
      verLinks.innerHTML = '<a class="dl-btn" href="'+v.url+'" target="_blank" rel="noopener"><span class="ico">⬇️</span><span>'+v.file+'<small>'+v.sub+'</small></span></a>';
      verNote.textContent = v.note;
    }
    verChips.forEach(function(c){ c.addEventListener('click', function(){ setDiskVersion(c.getAttribute('data-ver')); }); });
    setDiskVersion('stable');
    applyInstallMode();

    // Mode chips (step 6)
    var modeChips = document.querySelectorAll('#mode-chips .chip');
    var modeTip = document.getElementById('mode-tip');
    function setMode(mode){
      modeChips.forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-mode')===mode); });
      modeTip.textContent = S.modeTips[mode];
    }
    modeChips.forEach(function(c){ c.addEventListener('click', function(){ setMode(c.getAttribute('data-mode')); }); });
    setMode('screen');

    updateNav();
  }

  boot(currentLang);
})();
</script>
</body>
</html>
