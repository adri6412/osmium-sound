# Keep rules for the app's own code.
#
# The app is a fork of Squeezer and the package was renamed to
# com.osmium.sound.companion. That rename is why R8 had to be switched off in
# 7f9265d ("R8 minification was breaking Android 16"): every rule in here still
# named uk.org.ngo.squeezer, so nothing below matched and the reflective code
# paths lost the classes and constructors they look up by name at runtime.

# Generic type arguments are read back at runtime (see util/Reflection.java),
# so the signature attributes have to survive, together with the inner/outer
# class links the listeners declared inside CometClient depend on.
-keepattributes Signature,InnerClasses,EnclosingMethod

# These three hierarchies resolve their own type parameter through
# Class#getGenericSuperclass / #getGenericInterfaces: BaseListHandler (which
# then builds the model objects), ItemAdapter, and the item list callbacks.
# Renaming them is fine - R8 rewrites the signature - but they must not be
# removed or merged into another class, which would lose it.
-keep,allowobfuscation class * extends com.osmium.sound.companion.service.BaseListHandler
-keep,allowobfuscation class * extends com.osmium.sound.companion.framework.ItemAdapter
-keep,allowobfuscation class * implements com.osmium.sound.companion.itemlist.IServiceItemListCallback

# Model objects are built reflectively from the server's responses
# (BaseListHandler.add -> getDeclaredConstructor(Map.class)); without the
# constructors you get NoSuchMethodException as soon as a list is browsed.
-keep class com.osmium.sound.companion.model.** {
    <init>(java.lang.String);
    <init>(java.util.Map);
    <init>(android.os.Parcel);
}

# Classes named in res/ XML. aapt2 does generate keep rules for these, but a
# fragment or a custom view that loses its no-arg/AttributeSet constructor
# crashes the screen it belongs to, so they are spelled out here as well.
-keep class com.osmium.sound.companion.NowPlayingFragment { <init>(); }
-keep class com.osmium.sound.companion.SettingsFragment { <init>(); }
-keep class com.osmium.sound.companion.IntEditTextPreference { <init>(...); }
-keep class com.osmium.sound.companion.dialog.ServerAddressView { <init>(...); }
-keep class com.osmium.sound.companion.widget.ContinuousSlider { <init>(...); }
-keep class com.osmium.sound.companion.widget.RadialSeekBar { <init>(...); }

# Fragments are re-created by name when the system restores an activity, and
# the enum ids that travel in preferences and in Parcels are looked up through
# Class#getEnumConstants (framework/EnumIdLookup).
-keepclassmembers class * extends androidx.fragment.app.Fragment {
    <init>();
}
-keepclassmembers enum com.osmium.sound.companion.** {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Strip out certain logging calls.
-assumenosideeffects class android.util.Log {
    public static *** d(...);
    public static *** v(...);
}
