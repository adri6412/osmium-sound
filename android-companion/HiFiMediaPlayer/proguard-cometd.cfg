# Proguard configuration for Comet client

-dontwarn org.codehaus.jackson.**
-dontwarn com.fasterxml.jackson.databind.**
-dontwarn java.nio.file.**
-dontwarn java.nio.channels.**
-dontwarn java.awt.**
-dontwarn javax.imageio.**
-dontwarn java.io.**
-dontwarn javax.servlet.**
-dontwarn javax.net.**
-dontwarn org.slf4j.**
-dontwarn javax.management.**
-dontwarn java.lang.management.**
-dontwarn org.eclipse.jetty.**
-dontwarn org.cometd.**

# CometD and the Jetty client underneath it load a fair amount by name: the
# logger implementation (org.eclipse.jetty.util.log.Log), the JSON context of
# the transport, the JSON convertors. Unused classes still get dropped
# (-keepnames only rules out renaming), so this costs size but no correctness.
-keepnames class org.eclipse.jetty.** { *; }
-keepnames class org.cometd.** { *; }
-keepnames class org.slf4j.** { *; }

# Jetty picks up its logger through Class#forName on these names and falls
# back to stderr logging when they are missing.
-keep class org.eclipse.jetty.util.log.Slf4jLog { <init>(...); }
-keep class org.eclipse.jetty.util.log.StdErrLog { <init>(...); }
