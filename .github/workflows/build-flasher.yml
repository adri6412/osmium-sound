name: Build Osmium Flasher (manual)

# Builds the desktop app that writes the installer ISO to a USB stick.
#
#   Actions → "Build Osmium Flasher (manual)" → Run workflow
#
# The binaries are NOT published anywhere by this job. Download the artifacts
# and upload them to file.osmiumsound.it by hand, the same way the ISO is
# published, then point website/beta/index.html at the new filenames.
#
# Reminder: `gh workflow run` without an explicit --ref silently builds from
# main. Always pass --ref <branch-or-tag> and check the run's branch column.
#
# The binaries are unsigned on purpose — see electron-builder.yml and the
# "unknown publisher" instructions on the beta page.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Flasher version to stamp (e.g. 1.0.0); leave empty to keep package.json'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: flasher

jobs:
  build:
    strategy:
      # One runner per target: native addons are compiled/fetched for the host
      # architecture, so cross-building is not an option here.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            build: npm run dist:linux
          - os: windows-latest
            label: win-x64
            build: npm run dist:win
          - os: macos-14
            label: mac-arm64
            build: npm run dist:mac
          - os: macos-13
            label: mac-x64
            build: npm run dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: flasher/package-lock.json

      - name: Stamp the version
        if: ${{ inputs.version != '' }}
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: ${{ matrix.build }}
        env:
          # Without a certificate electron-builder would otherwise go looking
          # for one and fail the build rather than ad-hoc signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: osmium-flasher-${{ matrix.label }}
          path: |
            flasher/dist/*.exe
            flasher/dist/*.dmg
            flasher/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
