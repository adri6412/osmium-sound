name: CLA Assistant

# Asks first-time contributors to sign the Contributor License Agreement
# (CLA.md) before their pull request can be merged, and records signatures
# on the dedicated `cla-signatures` branch.
#
# Note: pull_request_target workflows always run from the default branch
# (main), so this job becomes active once it lands there.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/adri6412/osmium-sound/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'adri6412,dependabot[bot],google-labs-jules[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge it, we ask you
            to sign our [Contributor License Agreement](https://github.com/adri6412/osmium-sound/blob/main/CLA.md)
            (one click, one time — see [CONTRIBUTING.md](https://github.com/adri6412/osmium-sound/blob/main/CONTRIBUTING.md)
            for why it exists and what it commits us to in return). Please reply with the sentence below.
