name: Build HiFi Player OTA bundles (UI + system)

# Builds two OTA payloads and publishes them as assets of the GitHub Release:
#  • hifi-ui-<ver>.tar.gz     — the Electron UI (unpacked linux dir)
#  • hifi-system-<ver>.tar.gz — the custom system components (Python API/daemons,
#                                helper scripts, systemd units)
# The appliance's OTA updaters (Settings → Aggiornamenti) download these.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui-ota:
    runs-on: ubuntu-latest
    # Without this a hung step (an apt mirror that never answers, say) keeps the
    # job alive for the 6h default instead of failing fast enough to rerun.
    timeout-minutes: 30

    # Skip if this is a companion app release tag
    if: ${{ !contains(github.ref, 'companion') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history + all tags, not the default single-commit shallow
          # clone — the changelog step below needs to walk back to the
          # previous release's tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + unpacked Electron app
        run: |
          npm run build
          npx electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web-admin (Vue) — shipped in the system bundle
        # Separate, self-contained Vue project (does not touch the Electron
        # kiosk build). Served by webui_server.py from /opt/hifi-webui/dist.
        # Fail loud rather than silently shipping a system bundle without it —
        # see the "Package system-components OTA bundle" step below, which
        # also refuses to package without a real build.
        run: |
          if [ -f admin-webui/package.json ]; then
            (cd admin-webui && npm ci && npm run build)
          else
            echo "::error::admin-webui/package.json missing — cannot build the web-admin UI" >&2
            exit 1
          fi

      - name: Build the Qt on-screen interface payload (/opt/hifi-qt)
        # 🚨 Fonte unica con l'immagine ISO (build-iso.yml, lavoro qt-payload):
        # compilazione su base Debian 13 dentro docker e composizione del
        # pacchetto stanno in un solo script, cosi' l'aggiornamento e l'immagine
        # non possono divergere. Questo lavoro NON gira dentro un contenitore:
        # allo script serve docker.
        run: bash native-ui-qt/ci/build-payload.sh qtui
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        # Powers the "what's new" popup in the Updates screen on web-admin,
        # kiosk, and the Android companion app (see _check_release_update's
        # `notes` field in api_server.py). Built from the actual commit log
        # since the previous published release, not hand-authored — this repo
        # ships small dev builds often (see release-versioning-rules), so a
        # manual changelog file would rot immediately. `chore(release)`
        # version-bump-only commits are filtered out as noise.
        id: changelog
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CUR="${{ steps.ver.outputs.version }}"
          PREV="$(gh release list --repo "${{ github.repository }}" --limit 1 \
                    --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="refs/tags/$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## What's new in $CUR"
            echo
            git log --no-merges --format='- %s' "$RANGE" \
              | grep -vE '^- chore\(release\)' || true
          } > CHANGELOG_RELEASE.md
          if ! grep -q '^- ' CHANGELOG_RELEASE.md; then
            echo "- Minor fixes and internal improvements." >> CHANGELOG_RELEASE.md
          fi
          cat CHANGELOG_RELEASE.md
          echo "file=CHANGELOG_RELEASE.md" >> "$GITHUB_OUTPUT"

      - name: Package UI OTA bundle (tarball + sha256)
        id: pack
        run: |
          # 🚨 Da 2.5.24 il canale "ui" porta l'interfaccia Qt (/opt/hifi-qt),
          # non piu' l'app Electron: e' quella che si aggiorna d'ora in poi.
          # hifi-ota-update.sh sull'apparecchio riconosce i due contenuti dal
          # loro eseguibile (hifi-qt oppure hifi-media-player), quindi i
          # pacchetti gia' pubblicati restano installabili.
          VERSION="${{ steps.ver.outputs.version }}"
          [ -x qtui/hifi-qt ] || { echo "::error::qtui/hifi-qt mancante — l'interfaccia Qt non e' stata costruita" >&2; exit 1; }
          printf '%s\n' "$VERSION" > qtui/UI_VERSION
          # nome NUOVO: l'aggiornatore vecchio rifiuterebbe un pacchetto senza
          # Electron e bloccherebbe tutto l'aggiornamento; non trovando
          # `hifi-ui-` quegli apparecchi saltano il passo e lo prendono al giro dopo
          TAR="hifi-qtui-${VERSION}.tar.gz"
          tar czf "$TAR" -C qtui .
          sha256sum "$TAR" > "${TAR}.sha256"
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Package system-components OTA bundle (tarball + sha256)
        id: packsys
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ROOT=sysbundle
          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr/local/bin" "$ROOT/usr/local/sbin" "$ROOT/etc/systemd/system"
          # Python API + daemons
          cp api_server.py vu_meter_daemon.py sources_server.py webui_server.py hifi_logging.py hifi_backup.py hifi_i18n.py "$ROOT/usr/local/bin/"
          # Web-admin Vue build (served by webui_server.py from /opt/hifi-webui/dist).
          # REQUIRED: a missing/empty dist here means every device that applies
          # this system bundle loses the web-admin UI, silently. Fail instead.
          if [ -f admin-webui/dist/index.html ]; then
            mkdir -p "$ROOT/opt/hifi-webui/dist"
            cp -r admin-webui/dist/. "$ROOT/opt/hifi-webui/dist/"
          else
            echo "::error::admin-webui/dist missing or empty (no index.html) — refusing to package a system bundle without the web-admin UI" >&2
            exit 1
          fi
          # Helper / OTA scripts (sh + python workers)
          cp distro/config/includes.chroot/usr/local/sbin/*.sh \
             distro/config/includes.chroot/usr/local/sbin/*.py "$ROOT/usr/local/sbin/"
          # Osmium LMS skin assets (Material Skin theme + global css), installed
          # into Lyrion's prefs by sources_server.py's lms_skin logic.
          mkdir -p "$ROOT/usr/local/share"
          cp -r distro/config/includes.chroot/usr/local/share/hifi-lms-skin "$ROOT/usr/local/share/"
          # Schema A/B (RAUC): template del selettore GRUB e di system.conf, initrd
          # di conversione, keyring pubblica con cui l'apparecchio accetta i bundle.
          cp -r distro/config/includes.chroot/usr/local/share/hifi-ab "$ROOT/usr/local/share/"
          cp distro/rauc-keys/keyring.pem "$ROOT/usr/local/share/hifi-ab/keyring.pem"
          # systemd units (+ timer)
          cp distro/config/includes.chroot/etc/systemd/system/*.service "$ROOT/etc/systemd/system/"
          cp distro/config/includes.chroot/etc/systemd/system/*.timer "$ROOT/etc/systemd/system/" 2>/dev/null || true
          # Interfaccia Qt (seconda interfaccia su schermo, scelta da
          # /etc/hifi-player/ui-engine). Sta nel pacchetto di SISTEMA e non in
          # quello UI perché il bundle "ui" viene scompattato per intero su
          # /opt/hifi-media-player (è l'app Electron e basta), mentre questo
          # arriva con i suoi percorsi. Il file dell'unità è già incluso qui
          # sotto insieme agli altri .service: resta DISABILITATA finché non la
          # si sceglie, così un apparecchio che si aggiorna non cambia
          # interfaccia da solo.
          # (l'interfaccia Qt non sta piu' qui: viaggia nel canale interfaccia)
          printf '%s\n' "$VERSION" > "$ROOT/SYSTEM_VERSION"
          TAR="hifi-system-${VERSION}.tar.gz"
          tar czf "$TAR" -C "$ROOT" .
          sha256sum "$TAR" > "${TAR}.sha256"
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: The migration to A/B must never fall out of a release
        # 🚨 A device can sit switched off for a year and then jump straight to
        # the newest release: there is no replay of the versions in between.
        # So EVERY release has to carry the conversion with it, exactly like
        # apply.sh has to stay cumulative. If these files ever stop shipping,
        # every appliance still on the old layout is stranded there for good --
        # and nothing else would notice, because converted devices do not use
        # them. Hence a hard check on the packaged tarball, not on the repo.
        run: |
          set -euo pipefail
          TAR="${{ steps.packsys.outputs.tarball }}"
          [ -f "$TAR" ] || { echo "::error::system tarball missing"; exit 1; }
          # 🚨 The listing goes to a FILE, and grep reads that file. With
          # `tar tzf ... | grep -q`, grep leaves as soon as it matches, tar dies
          # of SIGPIPE, and under `set -o pipefail` the pipeline reports failure
          # precisely when the file WAS found — which is how this check first
          # reported every single file as missing.
          tar tzf "$TAR" > /tmp/sysbundle.list
          MISSING=""
          for f in \
            ./usr/local/sbin/hifi-ab-precheck.sh \
            ./usr/local/sbin/hifi-ab-convert.sh \
            ./usr/local/sbin/hifi-ab-seed.sh \
            ./usr/local/sbin/hifi-ab-firstboot.sh \
            ./usr/local/sbin/hifi-ab-image.sh \
            ./usr/local/sbin/hifi-ab-lib.sh \
            ./usr/local/sbin/hifi-image-update.sh \
            ./usr/local/share/hifi-ab/grub-selector.cfg.tmpl \
            ./usr/local/share/hifi-ab/system.conf.tmpl \
            ./usr/local/share/hifi-ab/keyring.pem \
            ./usr/local/share/hifi-ab/initramfs/hooks/hifi-ab \
            ./usr/local/share/hifi-ab/initramfs/scripts/local-premount/hifi-ab-convert \
            ./etc/systemd/system/hifi-ab-finish.service \
            ./etc/systemd/system/hifi-ab-image.service ; do
            grep -qx -- "$f" /tmp/sysbundle.list || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the system bundle no longer carries the A/B migration:$MISSING"
            exit 1
          fi
          # and the OS payload must still arm it
          grep -q 'hifi-ab-convert.sh' distro/config/includes.chroot/usr/local/sbin/hifi-update-apply-runner.sh \
            || { echo "::error::the apply runner no longer arms the A/B conversion"; exit 1; }
          [ -s distro/os-update/apply.d/0061-ab-prepare.sh ] \
            || { echo "::error::apply.d/0061-ab-prepare.sh is gone: legacy devices would never get rauc"; exit 1; }
          echo "migration present in $TAR"

      - name: Test the OTA update sequencer + system settings
        # The two-phase sequencer is what keeps a multi-component update from
        # stopping half-way (a restarted hifi-api mid-stage, an interrupted
        # download, a crash mid-apply); the timezone suite guards the OS state
        # api_server writes outside its own /etc/hifi-player/ tree. All four
        # suites are hermetic — the shell ones run each runner against stub
        # updaters in a temp dir, the Python ones redirect every path they
        # touch — so none needs an appliance.
        run: |
          set -e
          echo "== stage sequencer (shell) =="
          sh tests/test-update-stage-runner.sh
          echo "== apply sequencer (shell) =="
          sh tests/test-update-apply-runner.sh
          echo "== add-on guardian (shell) =="
          sh tests/test-ext-guardian.sh
          echo "== apt shim (shell) =="
          sh tests/test-apt-shim.sh
          echo "== update plan (python) =="
          python3 -m pip install --quiet flask flask-cors
          python3 tests/test_update_plan.py
          echo "== timezone (python) =="
          python3 tests/test_timezone.py
          echo "== static IPv4 (python) =="
          python3 tests/test_static_ipv4.py

      - name: Stage LMS skin assets into the OS payload
        # apply.d/0048-lms-skin-assets.sh installs these; they are deliberately
        # NOT committed under distro/os-update/files/ so there is a single source
        # of truth (the same tree live-build bakes and the system bundle ships)
        # and the image / system bundle / OS bundle cannot drift apart.
        # Runs BEFORE the idempotency test on purpose, so that test exercises the
        # migration for real instead of hitting its no-op branch.
        run: |
          set -e
          SRC=distro/config/includes.chroot/usr/local/share/hifi-lms-skin
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC missing — refusing to build an OS payload that would silently ship no LMS skin assets" >&2
            exit 1
          fi
          rm -rf distro/os-update/files/hifi-lms-skin
          mkdir -p distro/os-update/files
          cp -r "$SRC" distro/os-update/files/
          find distro/os-update/files/hifi-lms-skin -type f | sort

      - name: Lint + idempotency test for OS update payload
        # Guards the OS-channel contract automatically: shellcheck the runner +
        # helpers + migrations, then prove apply.sh is idempotent — a second run
        # over already-applied state must report changed=0 and request NO reboot
        # (the payload re-runs on every release, so a spurious reboot would
        # reboot every device on every update).
        run: |
          set -e
          # shellcheck ships with the ubuntu-latest image, so normally there is
          # nothing to install. Only reach for apt as a fallback, and cap it: a
          # hanging mirror used to wedge this step for hours with no output.
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "== shellcheck not preinstalled, installing =="
            export DEBIAN_FRONTEND=noninteractive
            for try in 1 2 3; do
              if timeout 120 sudo -E apt-get update -qq \
                && timeout 180 sudo -E apt-get install -y shellcheck >/dev/null; then
                break
              fi
              echo "apt attempt $try failed or timed out"
              if [ "$try" = 3 ]; then
                echo "FAIL: could not install shellcheck"
                exit 1
              fi
              sleep 10
            done
          fi
          echo "== shellcheck =="
          shellcheck -s sh distro/os-update/apply.sh distro/os-update/lib.sh distro/os-update/apply.d/*.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-update-stage-runner.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-update-apply-runner.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-system-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-os-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-enroll-key.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-alpha-toggle.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-lib.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-precheck.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-convert.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-seed.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-firstboot.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ab-image.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-image-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ext.sh \
            distro/config/includes.chroot/usr/local/bin/apt \
            tests/test-update-stage-runner.sh tests/test-update-apply-runner.sh \
            tests/test-ext-guardian.sh tests/test-apt-shim.sh
          echo "== idempotency (run apply.sh twice) =="
          export HIFI_OS_VERSION=ci-test
          export HIFI_PAYLOAD_DIR="$PWD/distro/os-update"
          export HIFI_OS_NO_APT=1
          rm -f "$HIFI_PAYLOAD_DIR/REBOOT"
          echo "--- first run (applies) ---"
          sudo -E sh "$HIFI_PAYLOAD_DIR/apply.sh"
          echo "--- second run (must be a clean no-op) ---"
          OUT2="$(sudo -E sh "$HIFI_PAYLOAD_DIR/apply.sh")"
          echo "$OUT2"
          echo "$OUT2" | grep -q 'SUMMARY: changed=0 failed=0 ' \
            || { echo "FAIL: second run reported changes/failures (not idempotent)"; exit 1; }
          echo "$OUT2" | grep -q 'reboot=no' \
            || { echo "FAIL: second run requested a reboot on a no-op"; exit 1; }
          [ ! -f "$HIFI_PAYLOAD_DIR/REBOOT" ] \
            || { echo "FAIL: REBOOT marker present after an idempotent run"; exit 1; }
          echo "OK: OS update payload is idempotent and reboot-clean."

      - name: Package OS OTA bundle (signed tarball + sha256 + signature)
        id: packos
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=distro/os-update
          # ship the version actually being released, overriding the placeholder
          printf '%s\n' "$VERSION" > "$SRC/OS_VERSION"
          TAR="hifi-os-${VERSION}.tar.gz"
          # Exclude docs + any runtime scratch the idempotency test left behind;
          # keep apply.sh + lib.sh + apply.d/ + files/ + OS_VERSION.
          tar czf "$TAR" -C "$SRC" \
            --exclude=README.md --exclude=.hifi-state --exclude=REBOOT .
          # sha256 sidecar — exact bytes the device reconstructs and verifies.
          DIGEST=$(sha256sum "$TAR" | awk '{print $1}')
          printf '%s  %s\n' "$DIGEST" "$TAR" > "${TAR}.sha256"
          # Sign the sidecar with the offline Ed25519 key. Without the secret we
          # skip signing — the device will then refuse the (unsigned) bundle.
          if [ -n "$OTA_SIGNING_KEY" ]; then
            printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota-key.pem
            openssl pkeyutl -sign -inkey /tmp/ota-key.pem -rawin \
              -in "${TAR}.sha256" -out "${TAR}.sha256.sig"
            rm -f /tmp/ota-key.pem
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OTA_SIGNING_KEY not set — OS bundle published UNSIGNED and will be rejected by devices."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Generate offline dev installer (.sh)
        id: installer
        # DEV releases only (tag with a hyphen, e.g. v2.5.9-dev.8). Produces a
        # self-contained script that applies System + UI (+ OS) for this release
        # over SSH, pulling assets from the release CDN — no api.github.com, so
        # it's immune to the unauthenticated REST rate limit that makes the
        # in-app check intermittently "not find" a new release.
        if: github.ref_type == 'tag' && contains(github.ref_name, '-')
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          OUT="hifi-install-${VERSION}.sh"
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__REPO__|${{ github.repository }}|g" \
              distro/dev-installer/install.sh.tmpl > "$OUT"
          chmod +x "$OUT"
          echo "installer=$OUT" >> "$GITHUB_OUTPUT"

      - name: Keep the bundles + Qt payload for the image job
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundles
          path: |
            hifi-qtui-*.tar.gz*
            hifi-system-*.tar.gz*
            hifi-os-*.tar.gz*
            CHANGELOG_RELEASE.md
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qt-payload
          path: qtui
          retention-days: 1
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # 🚨 Born as a DRAFT, and it stays one until the image is attached
          # too. This job ends ~35 minutes before the image job does, and until
          # today the release (and the OTA manifest) went out the moment it
          # finished: a device still on the old layout would see the update,
          # apply it, convert itself — and then look for an image that did not
          # exist yet. A draft is invisible to the API the devices read, so
          # nobody sees a release that cannot be completed. publish-image
          # un-drafts it; if the image fails, the release simply never appears.
          # Companion tags have no image step, so they are published straight
          # away or they would stay a draft for ever.
          draft: ${{ !contains(github.ref_name, 'companion') }}
          # A tag with a hyphen (e.g. v2.5.7-dev.1) is a prerelease → the dev
          # OTA channel. GitHub's /releases/latest (used by the prod channel)
          # ignores prereleases, so dev builds never reach prod devices.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.changelog.outputs.file }}
          # The installer glob matches only on dev tags (built above); on prod
          # tags it matches nothing and is silently skipped.
          fail_on_unmatched_files: false
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
            ${{ steps.packsys.outputs.tarball }}
            ${{ steps.packsys.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}
            ${{ steps.packos.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}.sha256.sig
            hifi-install-*.sh

      # Publish a static release manifest to GitHub Pages so the appliance's
      # update check reads from a CDN (not rate-limited) instead of the
      # api.github.com REST API (60 req/hour/IP). Written per channel: a dev tag
      # updates latest-dev.json, a stable tag updates latest-prod.json.
      - name: Build OTA Pages manifest
        id: manifest
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if printf '%s' "$VERSION" | grep -qE -- '-alpha[0-9]+$'; then CH=alpha
          elif printf '%s' "$VERSION" | grep -q '-'; then CH=dev
          else CH=prod
          fi
          python3 .github/scripts/make-ota-manifest.py \
            "$VERSION" "${{ github.repository }}" "$CH" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.packsys.outputs.tarball }}" \
            "${{ steps.packos.outputs.tarball }}" \
            "${{ steps.changelog.outputs.file }}"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      # Commits the manifest to the gh-pages branch — despite the action's
      # name this is just a git push, not a GitHub Pages deploy. Cloudflare
      # Pages (osmium-sound.pages.dev) watches this same branch and
      # redeploys on its own from here; see OTA_MANIFEST_BASE in
      # api_server.py for why GitHub Pages itself is no longer in the loop
      # (its custom-domain cert got permanently stuck).
      # Same reason as the draft above: the manifest is what a device actually
      # reads, so it must not name a release that is still missing half of
      # itself. For a tag that will get an image, publish-image pushes it at
      # the end instead.
      - name: Push OTA manifest to gh-pages branch
        if: ${{ github.ref_type == 'tag' && contains(github.ref_name, 'companion') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manifest-out
          publish_branch: gh-pages
          destination_dir: ota
          keep_files: true          # don't wipe the website already on gh-pages

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hifi-ota
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
            ${{ steps.packsys.outputs.tarball }}
            ${{ steps.packsys.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}
            ${{ steps.packos.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}.sha256.sig
          retention-days: 7

  # ── Immagine RAUC (schema A/B): squashfs + bundle firmato, allegata alla stessa Release ──
  # In un container Debian 13 (live-build, rauc 1.13). Parte dopo il job dei
  # bundle (riusa il payload Qt) e alla fine RIPUBBLICA il manifest del canale
  # con l'asset hifi-image-<ver>.raucb: gli apparecchi convertiti lo vedono
  # come step `image` (RAUC lo installa in streaming), i legacy lo ignorano.
  image:
    runs-on: ubuntu-latest
    needs: build-ui-ota
    if: ${{ !contains(github.ref, 'companion') }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: debian:trixie
      options: --privileged
      volumes:
        - /mnt:/mnt
    steps:
      - name: Install base tooling
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils sudo python3 build-essential \
            live-build imagemagick xorriso debootstrap debian-archive-keyring rsync fakeroot \
            cpio gzip squashfs-tools dosfstools mtools isolinux syslinux-common \
            rauc e2fsprogs zstd grub-common openssl initramfs-tools-core
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build renderer + unpacked Electron app
        run: |
          npm run build
          npx electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: qt-payload
          path: qtui
      - run: chmod 755 qtui/hifi-qt
      - name: Build web-admin (Vue)
        run: (cd admin-webui && npm ci && npm run build)
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="$(node -p "require('./package.json').version")-ci"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build the RAUC slot image
        env:
          INPUT_VERSION: ${{ steps.ver.outputs.version }}
          RAUC_SIGNING_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
          RAUC_SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /mnt/image-out
          export IMAGE_OUT=/mnt/image-out IMAGE_WORK=/mnt IMAGE_VERSION="$INPUT_VERSION"
          chmod +x distro/build-distro.sh distro/build-image.sh
          cd distro
          ./build-distro.sh --stage image --suite trixie \
            --app-dir "$GITHUB_WORKSPACE/dist/linux-unpacked" --qt-dir "$GITHUB_WORKSPACE/qtui" \
            --app-version "${INPUT_VERSION#v}"
          ls -lh /mnt/image-out
      - uses: actions/upload-artifact@v4
        with:
          name: ab-image
          path: /mnt/image-out/hifi-image-*
          retention-days: 14
          if-no-files-found: error

  publish-image:
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_type == 'tag'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ab-image
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: ota-bundles
          path: .
      # NB: every line inside `files:` below is a glob, not a place for
      # comments — a commented line there is looked up as a filename and,
      # with fail_on_unmatched_files, fails the step. Hence this note lives
      # here. The build-info is attached because on an A/B system the kernel
      # ships inside the image and is never upgraded on the device, so the only
      # honest answer to "what is my fleet running" is what was recorded when
      # the image was built.
      - name: Attach the image to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            hifi-image-*.raucb
            hifi-image-*.raucb.sha256
            hifi-image-*.info.txt
            hifi-image-*.build-info.txt
      - name: The release is complete — make it visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Both worlds are on it now (the legacy bundles from the first job,
          # the image from this one), so the devices may see it.
          gh release edit "${GITHUB_REF_NAME}" -R "${{ github.repository }}" --draft=false
          echo "release ${GITHUB_REF_NAME} published"

      - name: Rebuild the OTA Pages manifest with the image asset
        id: manifest
        run: |
          set -e
          V="${GITHUB_REF_NAME}"
          case "$V" in
            *-alpha[0-9]*) CH=alpha ;;
            *-*)           CH=dev ;;
            *)             CH=prod ;;
          esac
          UI=$(ls hifi-qtui-*.tar.gz hifi-ui-*.tar.gz 2>/dev/null | head -n 1)
          RAUCB=$(ls hifi-image-*.raucb | head -n 1)
          EXTRA_ASSETS="$RAUCB $RAUCB.sha256" python3 .github/scripts/make-ota-manifest.py \
            "$V" "${{ github.repository }}" "$CH" "$UI" "hifi-system-$V.tar.gz" "hifi-os-$V.tar.gz" CHANGELOG_RELEASE.md
          cat "manifest-out/latest-$CH.json"
      - name: Publish the manifest
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manifest-out
          publish_branch: gh-pages
          destination_dir: ota
          keep_files: true
          enable_jekyll: false
          commit_message: "ota: manifest ${{ github.ref_name }} (+ immagine RAUC)"

  # 🚨 A release has to serve BOTH worlds, always. We cannot know when a given
  # owner will update, or whether they will have migrated by then: a device
  # still on the old layout looks for hifi-qtui/system/os tarballs, one already
  # on A/B looks for the .raucb, and whichever family is missing makes that
  # half of the fleet see "you are up to date" forever. It is a silent failure
  # — nothing errors, the update simply never appears — and it nearly shipped
  # tonight, when the image job stopped and the release stayed published with
  # the legacy bundles alone. So the run does not end green unless every asset
  # a device could be looking for is actually on the release.
  verify-release:
    runs-on: ubuntu-latest
    needs: [build-ui-ota, image, publish-image]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'companion') }}
    steps:
      - name: Both the old and the new devices must find their update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name' > /tmp/assets.list || true
          cat /tmp/assets.list
          MISSING=""
          for want in \
            "hifi-qtui-$TAG.tar.gz" "hifi-qtui-$TAG.tar.gz.sha256" \
            "hifi-system-$TAG.tar.gz" "hifi-system-$TAG.tar.gz.sha256" \
            "hifi-os-$TAG.tar.gz" "hifi-os-$TAG.tar.gz.sha256" "hifi-os-$TAG.tar.gz.sha256.sig" \
            "hifi-image-$TAG.raucb" "hifi-image-$TAG.raucb.sha256" ; do
            grep -qx -- "$want" /tmp/assets.list || MISSING="$MISSING $want"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::release $TAG is incomplete:$MISSING — devices on the old layout and devices already on A/B must BOTH find their update in every release"
            exit 1
          fi
          DRAFT=$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft)
          if [ "$DRAFT" != "false" ]; then
            echo "::error::release $TAG is still a draft — it would be invisible to every device"
            exit 1
          fi
          echo "release $TAG serves both the old and the new layout, and is visible"
