name: Build HiFi Player OTA bundles (UI + system)

# Builds two OTA payloads and publishes them as assets of the GitHub Release:
#  • hifi-ui-<ver>.tar.gz     — the Electron UI (unpacked linux dir)
#  • hifi-system-<ver>.tar.gz — the custom system components (Python API/daemons,
#                                helper scripts, systemd units)
# The appliance's OTA updaters (Settings → Aggiornamenti) download these.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui-ota:
    runs-on: ubuntu-latest
    # Without this a hung step (an apt mirror that never answers, say) keeps the
    # job alive for the 6h default instead of failing fast enough to rerun.
    timeout-minutes: 30

    # Skip if this is a companion app release tag
    if: ${{ !contains(github.ref, 'companion') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history + all tags, not the default single-commit shallow
          # clone — the changelog step below needs to walk back to the
          # previous release's tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + unpacked Electron app
        run: |
          npm run build
          npx electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web-admin (Vue) — shipped in the system bundle
        # Separate, self-contained Vue project (does not touch the Electron
        # kiosk build). Served by webui_server.py from /opt/hifi-webui/dist.
        # Fail loud rather than silently shipping a system bundle without it —
        # see the "Package system-components OTA bundle" step below, which
        # also refuses to package without a real build.
        run: |
          if [ -f admin-webui/package.json ]; then
            (cd admin-webui && npm ci && npm run build)
          else
            echo "::error::admin-webui/package.json missing — cannot build the web-admin UI" >&2
            exit 1
          fi

      - name: Build the Qt on-screen interface (Debian trixie container)
        # La seconda interfaccia dell'apparecchio (native-ui-qt/): disegna
        # diritto su DRM/KMS con Qt 6 Quick, senza X e senza compositore.
        # Va compilata contro le STESSE librerie del dispositivo (Debian 13,
        # Qt 6.8): il runner è Ubuntu e le sue Qt sono un'altra versione, così
        # il binario non partirebbe. Quindi si compila dentro un contenitore
        # debian:trixie, che è esattamente l'immagine dell'apparecchio.
        #
        # Nello stesso contenitore si preparano anche i fotogrammi dell'intro
        # (l'interfaccia Qt non ha un decodificatore video: mostra i JPEG dello
        # stesso filmato che Electron riproduce) — un solo `apt-get` per
        # entrambe le cose.
        run: |
          set -e
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential pkg-config qt6-base-dev qt6-declarative-dev libdrm-dev ffmpeg > /dev/null
            cd native-ui-qt && make -j"$(nproc)"
          '
          ls -l native-ui-qt/hifi-qt

      - name: Assemble the Qt interface payload (/opt/hifi-qt)
        # Sorgente unica per gli asset: quelli di Electron (src/assets). Le
        # icone sono le stesse SVG di lucide che usa il kiosk, generate in
        # native-ui-qt/icons: si copiano SOLO quelle citate dal QML (sono 1300,
        # ~11 MB) e si fallisce se una citata non esiste, così un'icona vuota
        # non arriva mai sull'apparecchio.
        run: |
          set -e
          QT=qtui
          rm -rf "$QT"
          mkdir -p "$QT/qml" "$QT/icons" "$QT/assets/intro" "$QT/locales"
          install -m755 native-ui-qt/hifi-qt "$QT/hifi-qt"
          cp native-ui-qt/qml/*.qml "$QT/qml/"
          MISSING=0
          for n in $(grep -ohE '"[a-z0-9][a-z0-9-]*"' native-ui-qt/qml/*.qml | tr -d '"' | sort -u); do
            if [ -f "native-ui-qt/icons/$n.svg" ]; then
              cp "native-ui-qt/icons/$n.svg" "$QT/icons/"
              [ -f "native-ui-qt/icons/$n-fill.svg" ] && cp "native-ui-qt/icons/$n-fill.svg" "$QT/icons/"
            fi
          done
          # ogni `name:`/`icon:` del QML deve avere il suo file
          for n in $(grep -ohE '(name|icon):\s*"[a-z0-9][a-z0-9-]*"' native-ui-qt/qml/*.qml \
                     | grep -oE '"[a-z0-9][a-z0-9-]*"' | tr -d '"' | sort -u); do
            if [ ! -f "$QT/icons/$n.svg" ] && [ -f "native-ui-qt/icons/$n.svg" ]; then
              cp "native-ui-qt/icons/$n.svg" "$QT/icons/"
            fi
          done
          cp src/assets/vu-meter-dials.png src/assets/vu-meter-bezel.png "$QT/assets/"
          cp src/assets/ledbar/*.png "$QT/assets/"
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg > /dev/null
            ffmpeg -nostdin -loglevel error -i src/assets/intro.mp4 \
              -vf "fps=15,scale=960:-2" -q:v 4 qtui/assets/intro/%03d.jpg
          '
          cp src/i18n/locales/en.json src/i18n/locales/it.json "$QT/locales/"
          # le note di terze parti sono un array JS: lo stesso elenco che
          # Settings.jsx rende in Electron, riusato senza duplicarlo
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("src/data/thirdPartyNotices.js", "utf8")
              .replace(/^export const thirdPartyNotices =/m, "module.exports =");
            fs.writeFileSync("/tmp/tpn.cjs", src);
            fs.writeFileSync("qtui/locales/third_party.json", JSON.stringify(require("/tmp/tpn.cjs")));
          '
          test -s "$QT/locales/third_party.json"
          test "$(ls "$QT/assets/intro" | wc -l)" -gt 50 || { echo "::error::intro frames missing"; exit 1; }
          du -sh "$QT"; ls "$QT/icons" | wc -l

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        # Powers the "what's new" popup in the Updates screen on web-admin,
        # kiosk, and the Android companion app (see _check_release_update's
        # `notes` field in api_server.py). Built from the actual commit log
        # since the previous published release, not hand-authored — this repo
        # ships small dev builds often (see release-versioning-rules), so a
        # manual changelog file would rot immediately. `chore(release)`
        # version-bump-only commits are filtered out as noise.
        id: changelog
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CUR="${{ steps.ver.outputs.version }}"
          PREV="$(gh release list --repo "${{ github.repository }}" --limit 1 \
                    --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="refs/tags/$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## What's new in $CUR"
            echo
            git log --no-merges --format='- %s' "$RANGE" \
              | grep -vE '^- chore\(release\)' || true
          } > CHANGELOG_RELEASE.md
          if ! grep -q '^- ' CHANGELOG_RELEASE.md; then
            echo "- Minor fixes and internal improvements." >> CHANGELOG_RELEASE.md
          fi
          cat CHANGELOG_RELEASE.md
          echo "file=CHANGELOG_RELEASE.md" >> "$GITHUB_OUTPUT"

      - name: Package UI OTA bundle (tarball + sha256)
        id: pack
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          printf '%s\n' "$VERSION" > dist/linux-unpacked/UI_VERSION
          TAR="hifi-ui-${VERSION}.tar.gz"
          tar czf "$TAR" -C dist/linux-unpacked .
          sha256sum "$TAR" > "${TAR}.sha256"
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Package system-components OTA bundle (tarball + sha256)
        id: packsys
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ROOT=sysbundle
          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr/local/bin" "$ROOT/usr/local/sbin" "$ROOT/etc/systemd/system"
          # Python API + daemons
          cp api_server.py vu_meter_daemon.py sources_server.py webui_server.py hifi_logging.py hifi_backup.py hifi_i18n.py "$ROOT/usr/local/bin/"
          # Web-admin Vue build (served by webui_server.py from /opt/hifi-webui/dist).
          # REQUIRED: a missing/empty dist here means every device that applies
          # this system bundle loses the web-admin UI, silently. Fail instead.
          if [ -f admin-webui/dist/index.html ]; then
            mkdir -p "$ROOT/opt/hifi-webui/dist"
            cp -r admin-webui/dist/. "$ROOT/opt/hifi-webui/dist/"
          else
            echo "::error::admin-webui/dist missing or empty (no index.html) — refusing to package a system bundle without the web-admin UI" >&2
            exit 1
          fi
          # Helper / OTA scripts (sh + python workers)
          cp distro/config/includes.chroot/usr/local/sbin/*.sh \
             distro/config/includes.chroot/usr/local/sbin/*.py "$ROOT/usr/local/sbin/"
          # Osmium LMS skin assets (Material Skin theme + global css), installed
          # into Lyrion's prefs by sources_server.py's lms_skin logic.
          mkdir -p "$ROOT/usr/local/share"
          cp -r distro/config/includes.chroot/usr/local/share/hifi-lms-skin "$ROOT/usr/local/share/"
          # systemd units
          cp distro/config/includes.chroot/etc/systemd/system/*.service "$ROOT/etc/systemd/system/"
          # Interfaccia Qt (seconda interfaccia su schermo, scelta da
          # /etc/hifi-player/ui-engine). Sta nel pacchetto di SISTEMA e non in
          # quello UI perché il bundle "ui" viene scompattato per intero su
          # /opt/hifi-media-player (è l'app Electron e basta), mentre questo
          # arriva con i suoi percorsi. Il file dell'unità è già incluso qui
          # sotto insieme agli altri .service: resta DISABILITATA finché non la
          # si sceglie, così un apparecchio che si aggiorna non cambia
          # interfaccia da solo.
          mkdir -p "$ROOT/opt/hifi-qt"
          cp -r qtui/. "$ROOT/opt/hifi-qt/"
          printf '%s\n' "$VERSION" > "$ROOT/SYSTEM_VERSION"
          TAR="hifi-system-${VERSION}.tar.gz"
          tar czf "$TAR" -C "$ROOT" .
          sha256sum "$TAR" > "${TAR}.sha256"
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Test the OTA update sequencer + system settings
        # The two-phase sequencer is what keeps a multi-component update from
        # stopping half-way (a restarted hifi-api mid-stage, an interrupted
        # download, a crash mid-apply); the timezone suite guards the OS state
        # api_server writes outside its own /etc/hifi-player/ tree. All four
        # suites are hermetic — the shell ones run each runner against stub
        # updaters in a temp dir, the Python ones redirect every path they
        # touch — so none needs an appliance.
        run: |
          set -e
          echo "== stage sequencer (shell) =="
          sh tests/test-update-stage-runner.sh
          echo "== apply sequencer (shell) =="
          sh tests/test-update-apply-runner.sh
          echo "== update plan (python) =="
          python3 -m pip install --quiet flask flask-cors
          python3 tests/test_update_plan.py
          echo "== timezone (python) =="
          python3 tests/test_timezone.py
          echo "== static IPv4 (python) =="
          python3 tests/test_static_ipv4.py

      - name: Stage LMS skin assets into the OS payload
        # apply.d/0048-lms-skin-assets.sh installs these; they are deliberately
        # NOT committed under distro/os-update/files/ so there is a single source
        # of truth (the same tree live-build bakes and the system bundle ships)
        # and the image / system bundle / OS bundle cannot drift apart.
        # Runs BEFORE the idempotency test on purpose, so that test exercises the
        # migration for real instead of hitting its no-op branch.
        run: |
          set -e
          SRC=distro/config/includes.chroot/usr/local/share/hifi-lms-skin
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC missing — refusing to build an OS payload that would silently ship no LMS skin assets" >&2
            exit 1
          fi
          rm -rf distro/os-update/files/hifi-lms-skin
          mkdir -p distro/os-update/files
          cp -r "$SRC" distro/os-update/files/
          find distro/os-update/files/hifi-lms-skin -type f | sort

      - name: Lint + idempotency test for OS update payload
        # Guards the OS-channel contract automatically: shellcheck the runner +
        # helpers + migrations, then prove apply.sh is idempotent — a second run
        # over already-applied state must report changed=0 and request NO reboot
        # (the payload re-runs on every release, so a spurious reboot would
        # reboot every device on every update).
        run: |
          set -e
          # shellcheck ships with the ubuntu-latest image, so normally there is
          # nothing to install. Only reach for apt as a fallback, and cap it: a
          # hanging mirror used to wedge this step for hours with no output.
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "== shellcheck not preinstalled, installing =="
            export DEBIAN_FRONTEND=noninteractive
            for try in 1 2 3; do
              if timeout 120 sudo -E apt-get update -qq \
                && timeout 180 sudo -E apt-get install -y shellcheck >/dev/null; then
                break
              fi
              echo "apt attempt $try failed or timed out"
              if [ "$try" = 3 ]; then
                echo "FAIL: could not install shellcheck"
                exit 1
              fi
              sleep 10
            done
          fi
          echo "== shellcheck =="
          shellcheck -s sh distro/os-update/apply.sh distro/os-update/lib.sh distro/os-update/apply.d/*.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-update-stage-runner.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-update-apply-runner.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-system-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-os-update.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-enroll-key.sh \
            distro/config/includes.chroot/usr/local/sbin/hifi-ota-alpha-toggle.sh \
            tests/test-update-stage-runner.sh tests/test-update-apply-runner.sh
          echo "== idempotency (run apply.sh twice) =="
          export HIFI_OS_VERSION=ci-test
          export HIFI_PAYLOAD_DIR="$PWD/distro/os-update"
          export HIFI_OS_NO_APT=1
          rm -f "$HIFI_PAYLOAD_DIR/REBOOT"
          echo "--- first run (applies) ---"
          sudo -E sh "$HIFI_PAYLOAD_DIR/apply.sh"
          echo "--- second run (must be a clean no-op) ---"
          OUT2="$(sudo -E sh "$HIFI_PAYLOAD_DIR/apply.sh")"
          echo "$OUT2"
          echo "$OUT2" | grep -q 'SUMMARY: changed=0 failed=0 ' \
            || { echo "FAIL: second run reported changes/failures (not idempotent)"; exit 1; }
          echo "$OUT2" | grep -q 'reboot=no' \
            || { echo "FAIL: second run requested a reboot on a no-op"; exit 1; }
          [ ! -f "$HIFI_PAYLOAD_DIR/REBOOT" ] \
            || { echo "FAIL: REBOOT marker present after an idempotent run"; exit 1; }
          echo "OK: OS update payload is idempotent and reboot-clean."

      - name: Package OS OTA bundle (signed tarball + sha256 + signature)
        id: packos
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=distro/os-update
          # ship the version actually being released, overriding the placeholder
          printf '%s\n' "$VERSION" > "$SRC/OS_VERSION"
          TAR="hifi-os-${VERSION}.tar.gz"
          # Exclude docs + any runtime scratch the idempotency test left behind;
          # keep apply.sh + lib.sh + apply.d/ + files/ + OS_VERSION.
          tar czf "$TAR" -C "$SRC" \
            --exclude=README.md --exclude=.hifi-state --exclude=REBOOT .
          # sha256 sidecar — exact bytes the device reconstructs and verifies.
          DIGEST=$(sha256sum "$TAR" | awk '{print $1}')
          printf '%s  %s\n' "$DIGEST" "$TAR" > "${TAR}.sha256"
          # Sign the sidecar with the offline Ed25519 key. Without the secret we
          # skip signing — the device will then refuse the (unsigned) bundle.
          if [ -n "$OTA_SIGNING_KEY" ]; then
            printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota-key.pem
            openssl pkeyutl -sign -inkey /tmp/ota-key.pem -rawin \
              -in "${TAR}.sha256" -out "${TAR}.sha256.sig"
            rm -f /tmp/ota-key.pem
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OTA_SIGNING_KEY not set — OS bundle published UNSIGNED and will be rejected by devices."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Generate offline dev installer (.sh)
        id: installer
        # DEV releases only (tag with a hyphen, e.g. v2.5.9-dev.8). Produces a
        # self-contained script that applies System + UI (+ OS) for this release
        # over SSH, pulling assets from the release CDN — no api.github.com, so
        # it's immune to the unauthenticated REST rate limit that makes the
        # in-app check intermittently "not find" a new release.
        if: github.ref_type == 'tag' && contains(github.ref_name, '-')
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          OUT="hifi-install-${VERSION}.sh"
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__REPO__|${{ github.repository }}|g" \
              distro/dev-installer/install.sh.tmpl > "$OUT"
          chmod +x "$OUT"
          echo "installer=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a hyphen (e.g. v2.5.7-dev.1) is a prerelease → the dev
          # OTA channel. GitHub's /releases/latest (used by the prod channel)
          # ignores prereleases, so dev builds never reach prod devices.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.changelog.outputs.file }}
          # The installer glob matches only on dev tags (built above); on prod
          # tags it matches nothing and is silently skipped.
          fail_on_unmatched_files: false
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
            ${{ steps.packsys.outputs.tarball }}
            ${{ steps.packsys.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}
            ${{ steps.packos.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}.sha256.sig
            hifi-install-*.sh

      # Publish a static release manifest to GitHub Pages so the appliance's
      # update check reads from a CDN (not rate-limited) instead of the
      # api.github.com REST API (60 req/hour/IP). Written per channel: a dev tag
      # updates latest-dev.json, a stable tag updates latest-prod.json.
      - name: Build OTA Pages manifest
        id: manifest
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if printf '%s' "$VERSION" | grep -qE -- '-alpha[0-9]+$'; then CH=alpha
          elif printf '%s' "$VERSION" | grep -q '-'; then CH=dev
          else CH=prod
          fi
          python3 .github/scripts/make-ota-manifest.py \
            "$VERSION" "${{ github.repository }}" "$CH" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.packsys.outputs.tarball }}" \
            "${{ steps.packos.outputs.tarball }}" \
            "${{ steps.changelog.outputs.file }}"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      # Commits the manifest to the gh-pages branch — despite the action's
      # name this is just a git push, not a GitHub Pages deploy. Cloudflare
      # Pages (osmium-sound.pages.dev) watches this same branch and
      # redeploys on its own from here; see OTA_MANIFEST_BASE in
      # api_server.py for why GitHub Pages itself is no longer in the loop
      # (its custom-domain cert got permanently stuck).
      - name: Push OTA manifest to gh-pages branch
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manifest-out
          publish_branch: gh-pages
          destination_dir: ota
          keep_files: true          # don't wipe the website already on gh-pages

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hifi-ota
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
            ${{ steps.packsys.outputs.tarball }}
            ${{ steps.packsys.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}
            ${{ steps.packos.outputs.tarball }}.sha256
            ${{ steps.packos.outputs.tarball }}.sha256.sig
          retention-days: 7
