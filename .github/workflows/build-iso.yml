name: Build HiFi Player ISO (manual)

# Manually rebuilds the installer ISO and (optionally) attaches it to a GitHub
# Release for a tag you type in by hand.
#
#   Actions → "Build HiFi Player ISO (manual)" → Run workflow
#     • tag         : e.g. v1.0.5  (created on the current commit if missing)
#     • make_release: attach the ISO to a Release for that tag (default: true)
#     • lyrion_url  : override the Lyrion .deb URL (optional)
#     • suite       : Debian suite (default: trixie — labwc/xwayland non
#                     esistono su bookworm, vedi build-distro.sh)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/publish (e.g. v1.0.5)'
        required: true
        type: string
      make_release:
        description: 'Create/attach a GitHub Release for the tag'
        required: true
        type: boolean
        default: true
      lyrion_url:
        description: 'Lyrion Music Server .deb URL (leave empty for default)'
        required: false
        type: string
      suite:
        description: 'Debian suite'
        required: false
        type: string
        default: 'trixie'

permissions:
  contents: write

jobs:
  # 🚨 Lavoro a parte, sul runner nudo: costruisce l'interfaccia Qt che finisce
  # in /opt/hifi-qt dentro l'immagine. Non puo' stare nel lavoro dell'immagine
  # perche' quello gira DENTRO un contenitore debian:bookworm, e li' docker
  # (che serve a compilare su base Debian 13) non c'e'. Stesso identico
  # pacchetto dell'aggiornamento OTA: lo costruisce lo stesso script.
  qt-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the Qt on-screen interface payload
        run: bash native-ui-qt/ci/build-payload.sh qtui

      - name: Upload the Qt payload
        uses: actions/upload-artifact@v4
        with:
          name: qt-payload
          path: qtui
          retention-days: 1
          if-no-files-found: error

  # The system image that the installer writes into slot A. Built in its own
  # chroot (trixie, privileged) exactly like the OTA one: it CANNOT be carved
  # out of the ISO's live filesystem, which keeps live-boot and Electron and is
  # a different system. --no-bundle stops at the squashfs, so this job needs no
  # signing keys — the installer copies those blocks straight into the slot.
  image:
    runs-on: ubuntu-latest
    # 🚨 It consumes the qt-payload artifact, so it cannot start beside the job
    # that produces it: without this the download fails with "Artifact not
    # found" a minute into the run.
    needs: qt-payload
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: debian:trixie
      options: --privileged
      volumes:
        - /mnt:/mnt
    steps:
      - name: Install base tooling
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils sudo python3 build-essential \
            live-build imagemagick xorriso debootstrap debian-archive-keyring rsync fakeroot \
            cpio gzip squashfs-tools dosfstools mtools isolinux syslinux-common \
            rauc e2fsprogs zstd grub-common openssl initramfs-tools-core
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build renderer + unpacked Electron app
        run: |
          npm run build
          npx electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: qt-payload
          path: qtui
      - run: chmod 755 qtui/hifi-qt
      - name: Build web-admin (Vue)
        run: (cd admin-webui && npm ci && npm run build)
      - name: Build the system image (no bundle, no signing)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /mnt/image-out
          export IMAGE_OUT=/mnt/image-out IMAGE_WORK=/mnt IMAGE_VERSION="$INPUT_TAG"
          chmod +x distro/build-distro.sh distro/build-image.sh
          cd distro
          ./build-distro.sh --stage image --suite trixie --no-bundle \
            --app-dir "$GITHUB_WORKSPACE/dist/linux-unpacked" --qt-dir "$GITHUB_WORKSPACE/qtui" \
            --app-version "${INPUT_TAG#v}"
          ls -lh /mnt/image-out
      - uses: actions/upload-artifact@v4
        with:
          name: iso-system-image
          path: /mnt/image-out/hifi-image-*.rootfs.squashfs*
          retention-days: 3
          if-no-files-found: error

  build-iso:
    runs-on: ubuntu-latest
    needs: [qt-payload, image]
    timeout-minutes: 120
    # The debian:bookworm container defaults `run:` steps to sh (dash), which
    # lacks `set -o pipefail`. Force bash for every step.
    defaults:
      run:
        shell: bash
    # Build inside a real Debian container so live-build/debootstrap and the
    # Debian archive keyring behave correctly (Ubuntu hosts can trip on this).
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install base tooling (container is minimal)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils sudo \
            python3 build-essential \
            live-build imagemagick xorriso debootstrap \
            debian-archive-keyring rsync fakeroot \
            cpio gzip squashfs-tools dosfstools mtools isolinux syslinux-common

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + unpacked Electron app
        run: |
          npm run build
          npx electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the Qt interface built by the qt-payload job
        uses: actions/download-artifact@v8
        with:
          name: qt-payload
          path: qtui

      - name: Restore the executable bit (artifacts do not carry it)
        run: |
          set -eux
          chmod 755 qtui/hifi-qt
          if [ -f qtui/hifi-media-player ]; then chmod 755 qtui/hifi-media-player; fi
          ls -l qtui | head

      - name: Build web-admin (Vue) — injected into the ISO by build-distro.sh
        # build-distro.sh itself refuses to inject a missing/empty dist, but
        # fail fast here too rather than burning ~15min of live-build first.
        run: |
          if [ -f admin-webui/package.json ]; then
            (cd admin-webui && npm ci && npm run build)
          else
            echo "::error::admin-webui/package.json missing — cannot build the web-admin UI" >&2
            exit 1
          fi

      - name: Put the system image on the ISO
        uses: actions/download-artifact@v8
        with:
          name: iso-system-image
          path: /tmp/sysimage
      - name: Stage it where live-build picks it up
        run: |
          set -euo pipefail
          mkdir -p distro/config/includes.binary/osmium
          SQ=$(ls -1 /tmp/sysimage/hifi-image-*.rootfs.squashfs | head -n 1)
          [ -s "$SQ" ] || { echo "::error::the system image is missing"; exit 1; }
          cp "$SQ" distro/config/includes.binary/osmium/rootfs.squashfs
          ( cd distro/config/includes.binary/osmium \
            && sha256sum rootfs.squashfs > rootfs.squashfs.sha256 )
          ls -lh distro/config/includes.binary/osmium/

      - name: Build installer ISO (live-build, as root)
        run: |
          set -euo pipefail
          ARGS="--app-dir $GITHUB_WORKSPACE/dist/linux-unpacked --app-version ${INPUT_TAG#v} --suite $INPUT_SUITE"
          # l'interfaccia Qt e' quella predefinita da 2.5.24: senza di lei
          # l'immagine partirebbe con Electron, quindi qui si pretende
          ARGS="$ARGS --qt-dir $GITHUB_WORKSPACE/qtui"
          if [ -n "${INPUT_LYRION_URL}" ]; then
            ARGS="$ARGS --lyrion-url ${INPUT_LYRION_URL}"
          fi
          chmod +x distro/build-distro.sh
          cd distro
          # Already root inside the container — no sudo needed.
          ISO_NAME="hifi-player-${INPUT_TAG}.iso" ./build-distro.sh $ARGS
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_LYRION_URL: ${{ inputs.lyrion_url }}

      - name: Refuse an ISO too large to publish
        run: |
          set -euo pipefail
          # find, not ls in a pipeline: `ls a/*.iso *.iso` returns 2 when one
          # of the two patterns matches nothing, and under `set -o pipefail`
          # that killed the job right after a perfectly good ISO had been
          # built. find reports nothing and exits 0.
          ISO=$(find . -maxdepth 2 -name '*.iso' -print -quit 2>/dev/null || true)
          [ -n "$ISO" ] || exit 0
          SZ=$(stat -c %s "$ISO")
          echo "ISO size: $((SZ / 1048576)) MiB"
          # A GitHub release asset cannot exceed 2 GiB. Carrying the system
          # image costs ~900 MiB, so there is room but not much: fail here with
          # the number rather than at upload time with a generic API error.
          if [ "$SZ" -gt 2040109465 ]; then
            echo "::error::ISO is $((SZ / 1048576)) MiB — over the 2 GiB limit for a release asset. Trim the image or publish it to R2 instead."
            exit 1
          fi

      - name: Locate + checksum + sign the ISO
        id: iso
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ISO="hifi-player-${{ inputs.tag }}.iso"
          [ -f "$ISO" ] || ISO="$(ls -1 *.iso 2>/dev/null | head -n1)"
          [ -n "$ISO" ] && [ -f "$ISO" ] || { echo "No ISO produced"; exit 1; }
          sha256sum "$ISO" > "${ISO}.sha256"
          # Sign the sha256 sidecar with the same offline Ed25519 key used for
          # OS OTA bundles (see build-ui-ota.yml). Osmium Flasher verifies this
          # signature before it will write anything, and refuses an unsigned
          # image outright -- so unlike the OTA job, a missing key is fatal here
          # rather than a warning.
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY is not set -- the ISO would be unusable by Osmium Flasher."
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota-key.pem
          openssl pkeyutl -sign -inkey /tmp/ota-key.pem -rawin \
            -in "${ISO}.sha256" -out "${ISO}.sha256.sig"
          rm -f /tmp/ota-key.pem
          openssl pkeyutl -verify -pubin -inkey distro/ota-keys/ota-pubkey.pem \
            -rawin -in "${ISO}.sha256" -sigfile "${ISO}.sha256.sig" \
            || { echo "::error::the signature does not verify against the shipped public key"; exit 1; }
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO" "${ISO}.sha256" "${ISO}.sha256.sig"

      # latest.json is what Osmium Flasher polls to discover the current image.
      # It is NOT deployed anywhere by this job: upload it to
      # file.osmiumsound.it by hand, in the same pass as the ISO it describes.
      - name: Build the flasher manifest (latest.json)
        run: |
          set -euo pipefail
          python3 .github/scripts/make-iso-manifest.py \
            "${{ inputs.tag }}" "${{ steps.iso.outputs.iso }}"
          cp manifest-out/latest.json .
          cat latest.json

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: hifi-player-iso-${{ inputs.tag }}
          path: |
            ${{ steps.iso.outputs.iso }}
            ${{ steps.iso.outputs.iso }}.sha256
            ${{ steps.iso.outputs.iso }}.sha256.sig
            latest.json
          retention-days: 14

      - name: Create tag if missing
        if: ${{ inputs.make_release }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ inputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "HiFi Player $TAG"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ISO to GitHub Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # No `name:` on purpose. A release is named after its tag and nothing
          # else — "v2.5.21-dev.37", never "HiFi Player v2.5.21-dev.37". This
          # job usually attaches an ISO to a release the tag push already
          # created, but when it runs first it creates the release itself, and
          # a name here would stick.
          fail_on_unmatched_files: true
          # Same rule as build-ui-ota.yml: a hyphenated tag (dev/alpha build)
          # is a prerelease, so it never becomes /releases/latest and can't
          # be mistaken for a stable prod release by the OTA fallback path.
          prerelease: ${{ contains(inputs.tag, '-') }}
          files: |
            ${{ steps.iso.outputs.iso }}
            ${{ steps.iso.outputs.iso }}.sha256
            ${{ steps.iso.outputs.iso }}.sha256.sig
