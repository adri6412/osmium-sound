name: Build HiFi Media Player Companion APK

on:
  push:
    tags:
      - 'companion-v*'  # Trigger on companion app release tags (e.g. companion-v2.5.0)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradle
        run: chmod +x android-companion/gradlew

      - name: Decode and create keystore from secret
        run: |
          cd android-companion/HiFiMediaPlayer
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > hifi-media-player-local-release-key.keystore
          ls -lh hifi-media-player-local-release-key.keystore

      - name: Build release APK
        run: |
          cd android-companion
          ./gradlew assembleRelease
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "App Version: ${VERSION}"

      - name: Prepare APK files
        run: |
          mkdir -p release-artifacts
          cp android-companion/HiFiMediaPlayer/build/outputs/apk/release/*.apk release-artifacts/HiFiMediaPlayer-${{ steps.version.outputs.version }}-release.apk 2>/dev/null || true
          ls -lah release-artifacts/

      - name: Create GitHub Release
        # v2: make_latest isn't a valid input on v1 (build-ui-ota.yml is
        # already on v2 for the same reason).
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Companion releases must NEVER become the repo's "latest"
          # release (make_latest: false), and dev/beta tags are additionally
          # prereleases: the appliance's prod OTA channel reads
          # /releases/latest, and a companion APK release surfacing there
          # shadows the real latest stable vX.Y.Z bundle release. Same
          # dev/stable split as the fdroid-repo job below.
          prerelease: ${{ contains(github.ref_name, '-svil') || contains(github.ref_name, '-beta') }}
          make_latest: false
          files: |
            release-artifacts/*.apk
          body: |
            # HiFi Media Player Companion v${{ steps.version.outputs.version }}

            ## Release Notes

            ### Features
            - Desktop-inspired mobile UI
            - Dark theme with gold accents
            - Tab-based navigation (Musica, Radio, App/CD, Settings)
            - Large play/pause control (primary focus)
            - Volume control with visual feedback
            - Responsive layout for 4"-7" screens

            ### Build Information
            - **AGP Version**: 8.5.1
            - **Gradle Version**: 8.8
            - **Compile SDK**: 35 (Android 15)
            - **Target SDK**: 35 (Android 15)
            - **Min SDK**: 26 (Android 8.0)

            ### Installation
            1. Download the APK file below
            2. Enable "Unknown Sources" in Settings → Security
            3. Open the APK and install
            4. Grant required permissions
            5. Connect to HiFi Media Player server

            ### Requirements
            - Android 8.0 or higher
            - Local network connection to HiFi Media Player server
            - 4"-7" screen size (optimized for smartphones)

            ### What's New
            - Complete rebranding from android-squeezer
            - Redesigned UI to match desktop app
            - Fixed Gradle/AGP compatibility issues
            - Added comprehensive documentation

            ### Known Limitations
            - VU Meter intentionally excluded (mobile optimization)
            - Requires active server connection
            - Single-column layout (portrait primary)

            ### Documentation
            - [COMPANION_APP.md](../COMPANION_APP.md) - Main guide
            - [DESIGN_GUIDELINES.md](../android-companion/DESIGN_GUIDELINES.md) - Design specs
            - [BUILD_INSTRUCTIONS.md](../android-companion/BUILD_INSTRUCTIONS.md) - Build guide

            For issues or feedback, please create a GitHub issue.
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiFiMediaPlayer-APK
          path: release-artifacts/*.apk
          retention-days: 90

      - name: Build status check
        run: |
          echo "✅ Release build completed successfully"
          echo "📱 APK files are ready for distribution"
          cd android-companion
          ls -lh HiFiMediaPlayer/build/outputs/apk/release/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradle
        run: chmod +x android-companion/gradlew

      - name: Run unit tests
        run: |
          cd android-companion
          ./gradlew test --continue || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: android-companion/HiFiMediaPlayer/build/reports/tests/
          retention-days: 30

  lint:
    name: Run Lint Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradle
        run: chmod +x android-companion/gradlew

      - name: Run lint
        run: |
          cd android-companion
          ./gradlew lint --continue || true

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: android-companion/HiFiMediaPlayer/build/reports/lint/
          retention-days: 30

  fdroid-repo:
    name: Publish F-Droid Repo
    runs-on: ubuntu-latest
    needs: build
    # Stable releases only (tag "companion-vX.Y.Z", no -svil/-beta suffix) —
    # same production/beta split as publishTrack() in build.gradle. Dev
    # builds on svil stay off the F-Droid repo.
    if: startsWith(github.ref, 'refs/tags/companion-v') && !contains(github.ref, '-svil') && !contains(github.ref, '-beta')
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built APK
        uses: actions/download-artifact@v8
        with:
          name: HiFiMediaPlayer-APK
          path: release-artifacts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Fetch existing F-Droid repo state from gh-pages
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p fdroid/repo
          # Only restore previous APKs (needed so `fdroid update` keeps
          # older versions in the index/archive). Everything else —
          # per-app graphics, index files — must NOT be restored: fdroid
          # update only regenerates what's missing, so a stale copy of
          # e.g. icon.png here would silently keep overriding freshly
          # updated listing metadata/images forever.
          if [ -d /tmp/gh-pages/fdroid/repo ]; then
            find /tmp/gh-pages/fdroid/repo -maxdepth 1 -name '*.apk' -exec cp -a {} fdroid/repo/ \;
          fi

      - name: Decode repo signing keystore
        run: echo "${{ secrets.FDROID_REPO_KEYSTORE }}" | base64 -d > fdroid/keystore.p12

      - name: Copy new APK into repo
        run: cp release-artifacts/*.apk fdroid/repo/

      - name: Write repo signing password into config.yml
        working-directory: fdroid
        env:
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
        run: |
          {
            echo "keystorepass: \"$FDROID_REPO_KEYSTORE_PASSWORD\""
            echo "keypass: \"$FDROID_REPO_KEYSTORE_PASSWORD\""
          } >> config.yml

      - name: Update F-Droid index
        working-directory: fdroid
        run: fdroid update --create-metadata --verbose

      - name: Remove keystore before publishing
        if: always()
        run: rm -f fdroid/keystore.p12

      - name: Publish F-Droid repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          destination_dir: fdroid/repo
          publish_branch: gh-pages
          # keep_files so this doesn't wipe website/ or ota/ published on the
          # same branch (see deploy-pages.yml).
          keep_files: true
          cname: osmiumsound.qd.je

      # Pages source is build_type "workflow" (see build-ui-ota.yml for why) —
      # the push above no longer triggers a deploy on its own. Re-checkout
      # what was just pushed and publish it explicitly via Actions.
      - name: Checkout updated gh-pages for Actions-based Pages deploy
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-deploy

      - name: Deploy to GitHub Pages
        id: pages-deployment
        uses: actions/deploy-pages@v5

  fdroid-dev-repo:
    name: Publish F-Droid Dev Repo
    runs-on: ubuntu-latest
    needs: build
    # Dev builds only (tag "companion-vX.Y.Z-svilN") — the opt-in counterpart
    # of fdroid-repo above, published to a separate repo/URL so stable-only
    # users never see these as an "update". Mutually exclusive with
    # fdroid-repo: a given tag triggers exactly one of the two jobs.
    if: startsWith(github.ref, 'refs/tags/companion-v') && contains(github.ref, '-svil')
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built APK
        uses: actions/download-artifact@v8
        with:
          name: HiFiMediaPlayer-APK
          path: release-artifacts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Fetch existing F-Droid dev repo state from gh-pages
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p fdroid-dev/repo
          # Same reasoning as the stable job: only restore previous APKs, not
          # index/graphics, so `fdroid update` regenerates those fresh. This
          # dev repo's APK history lives under fdroid/dev/repo on gh-pages,
          # kept separate from the stable repo's fdroid/repo.
          if [ -d /tmp/gh-pages/fdroid/dev/repo ]; then
            find /tmp/gh-pages/fdroid/dev/repo -maxdepth 1 -name '*.apk' -exec cp -a {} fdroid-dev/repo/ \;
          fi

      - name: Decode repo signing keystore
        run: echo "${{ secrets.FDROID_REPO_KEYSTORE }}" | base64 -d > fdroid-dev/keystore.p12

      - name: Copy new APK into repo
        run: cp release-artifacts/*.apk fdroid-dev/repo/

      - name: Mirror app metadata from the stable repo
        # Title/description/icon/screenshots are maintained once, under
        # fdroid/metadata/ — this dev repo reuses them as-is rather than
        # keeping a second copy in git that could drift out of sync.
        run: cp -r fdroid/metadata fdroid-dev/metadata

      - name: Write repo signing password into config.yml
        working-directory: fdroid-dev
        env:
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
        run: |
          {
            echo "keystorepass: \"$FDROID_REPO_KEYSTORE_PASSWORD\""
            echo "keypass: \"$FDROID_REPO_KEYSTORE_PASSWORD\""
          } >> config.yml

      - name: Update F-Droid dev index
        working-directory: fdroid-dev
        run: fdroid update --create-metadata --verbose

      - name: Remove keystore before publishing
        if: always()
        run: rm -f fdroid-dev/keystore.p12

      - name: Publish F-Droid dev repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid-dev/repo
          destination_dir: fdroid/dev/repo
          publish_branch: gh-pages
          # keep_files so this doesn't wipe website/, ota/, or the stable
          # fdroid/repo published on the same branch.
          keep_files: true
          cname: osmiumsound.qd.je

      # Same "Pages source is build_type workflow" situation as the stable
      # job above — re-checkout what was just pushed and deploy it explicitly.
      - name: Checkout updated gh-pages for Actions-based Pages deploy
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-deploy

      - name: Deploy to GitHub Pages
        id: pages-deployment
        uses: actions/deploy-pages@v5
