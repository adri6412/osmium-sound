name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          # keep_files (not force_orphan) so deploying the website preserves the
          # OTA manifest the release workflow publishes under ota/ on this same
          # branch. force_orphan would wipe it on every website change.
          keep_files: true
          cname: osmiumsound.qd.je

      # Pages source is build_type "workflow" (see build-ui-ota.yml for why) —
      # the push above no longer triggers a deploy on its own. Re-checkout
      # what was just pushed and publish it explicitly via Actions.
      - name: Checkout updated gh-pages for Actions-based Pages deploy
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-deploy

      - name: Deploy to GitHub Pages
        id: pages-deployment
        uses: actions/deploy-pages@v5
