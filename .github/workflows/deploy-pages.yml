name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Just a git push to the gh-pages branch, despite the action's name —
      # Cloudflare Pages (osmium-sound.pages.dev) watches this branch and
      # redeploys on its own from here. GitHub Pages itself is no longer in
      # the loop: its custom-domain cert (osmiumsound.qd.je) got permanently
      # stuck, see api_server.py's OTA_MANIFEST_BASE for the same story on
      # the OTA-manifest side.
      - name: Push website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          # keep_files (not force_orphan) so deploying the website preserves the
          # OTA manifest the release workflow publishes under ota/ on this same
          # branch. force_orphan would wipe it on every website change.
          keep_files: true
