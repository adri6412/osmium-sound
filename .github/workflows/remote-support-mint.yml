name: Mint remote-support key

# On-demand, human-approved minting of a Tailscale auth key for the
# "remote support" toggle in Settings (see api_server.py's
# _mint_tailscale_authkey / set_remote_support). Replaces the old design of
# a single static, reusable key published at a public URL — that leaked
# publicly (twice) and, being reusable, gave anyone who found it standing
# access to the tailnet.
#
# Every run mints a FRESH key: reusable=false, ephemeral=true, a 5-minute
# expiry, and scoped to tag:hifi-support only. It is delivered to the
# requesting device encrypted (age) to a one-time public key the device
# generated for this request — so even though this repo is public and the
# resulting artifact is technically fetchable by anyone, the ciphertext is
# useless without the matching private key, which never leaves the device.
#
# The job targets the `remote-support` Environment, which must be
# configured (Settings → Environments) with a required reviewer — that
# manual approval, done once per request (not once per device), is the
# actual trust boundary: the Tailscale OAuth client credentials
# (TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET) only become readable to the
# job after a human approves the run.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'age public recipient the device generated for this one request'
        required: true
        type: string
      hostname:
        description: 'device hostname, shown to the reviewer only — not trusted for anything'
        required: true
        type: string

run-name: "support key for ${{ inputs.hostname }}"

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    environment: remote-support
    timeout-minutes: 5
    steps:
      - name: Get Tailscale OAuth access token
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          set -eu
          TOKEN=$(curl -fsS -d "client_id=$TS_OAUTH_CLIENT_ID" \
            -d "client_secret=$TS_OAUTH_CLIENT_SECRET" \
            https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::failed to obtain Tailscale OAuth token"; exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Mint an ephemeral, single-use, tag-scoped auth key
        run: |
          set -eu
          KEY=$(curl -fsS -X POST https://api.tailscale.com/api/v2/tailnet/-/keys \
            -H "Authorization: Bearer $TS_TOKEN" -H "Content-Type: application/json" \
            -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:hifi-support"]}}},"expirySeconds":300}' \
            | jq -r .key)
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error::failed to mint Tailscale auth key"; exit 1
          fi
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" | age -r "${{ inputs.recipient }}" -o support-key.age

      - name: Upload encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: support-key-${{ github.run_id }}
          path: support-key.age
          retention-days: 1
