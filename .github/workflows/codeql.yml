name: CodeQL

# Code scanning once a night and by hand, not on every push to main: the
# default setup ran all five languages for each website commit too, and its
# 700 MB Java dependency cache per run filled the repository's 10 GB of
# Actions cache, pushing out the Gradle and npm ones. The categories are the
# default setup's, so the existing alerts carry on.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: c-cpp
          - language: java-kotlin
          - language: javascript-typescript
          - language: python
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
