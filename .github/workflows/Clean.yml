name: Cleanup Cache & Artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches
        run: |
          gh cache list --limit 100 --json id -q '.[].id' | \
          xargs -I{} gh cache delete {} || echo "Nessuna cache da eliminare"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Delete all artifacts
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            -q '.artifacts[].id' | \
          xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
